<script>
  // ===== 缓存版本强制校验（v15：彻底破旧缓存） =====
  (function(){
    var VER = 'sanhua-v30';
    var KEY = 'sanhua_sw_ver';
    if (localStorage.getItem(KEY) !== VER) {
      /* 版本变了 → 清掉可能残留的旧缓存标记 */
      localStorage.setItem(KEY, VER);
      /* 如果是旧版 SW 控制的页面，强制重载一次 */
      if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
        /* 让新 SW 立即接管后刷新 */
        navigator.serviceWorker.getRegistration().then(function(reg){
          if (reg) { reg.update(); }
        }).catch(function(){});
      }
    }
    /* 检测是否被离线缓存的服务器返回了旧版页面 */
    if ('caches' in window) {
      caches.match('./index.html', {cacheName:VER}).then(function(r){
        if (!r) {
          /* 当前缓存名不匹配，说明有旧缓存残留，通知 SW 清理 */
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({type:'clear_old'});
          }
        }
      }).catch(function(){});
    }
  })();
</script>
<script>
  // 全局错误浮层：任何报错都显示出来，避免白屏
  (function () {
    function show(msg) {
      var el = document.getElementById('errBox');
      if (!el) {
        el = document.createElement('div');
        el.id = 'errBox';
        el.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#fff3f0;color:#a33;font:13px/1.6 monospace;padding:10px 14px;border-bottom:2px solid #e7a;white-space:pre-wrap;max-height:50%;overflow:auto;';
        document.body && document.body.appendChild(el);
      }
      el.textContent += msg + '\n';
    }
    window.__err = show;
    window.addEventListener('error', function (e) {
      show('⚠️ 页面出错：' + (e.message || e.error || e) + (e.filename ? (' @ ' + e.filename + ':' + e.lineno) : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      show('⚠️ 异步错误：' + (e.reason && (e.reason.message || e.reason)));
    });
  })();
</script>
