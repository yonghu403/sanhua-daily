  function ensureSeed() {
    if (!DB.get('media.recs', null)) setRecs(JSON.parse(JSON.stringify(SEED_CATS)));
  }

  let curCat = '全部';

  function totalCount() { return getRecs().reduce((s, c) => s + c.items.length, 0); }
  function allItems() { return getRecs().flatMap(c => c.items); }
  function itemsOf(cat) { return cat === '全部' ? allItems() : (getRecs().find(c => c.cat === cat) || { items: [] }).items; }

  function render(root) {
    ensureSeed();
    const cats = getRecs();
    root.innerHTML = `
      <div class="card" style="background:linear-gradient(135deg,#FCEFE2,#F7F1E4);border-color:#F0D8C2;">
        <div class="card-title"><span class="ci">${Icons.tv()}</span>影视文娱</div>
        <div class="hint" style="line-height:1.75;">追番、看综艺、刷电影，把心动的安利和你的点评都收在这里。上面按<b>分类词条</b>整理了热门推荐（联网时自动显示封面图），下面是你的私人片单与心得。</div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.star()}</span>最新推荐 <small>${totalCount()} 部</small></div>
        <div class="chip-group" id="catGrp" style="margin-bottom:9px;"></div>
        <div class="mgrid" id="recGrid"></div>
        <div class="row" style="margin-top:9px;gap:6px;">
          <button class="btn ghost grow sm" id="addWork">${Icons.plus()}加作品</button>
          <button class="btn ghost grow sm" id="addCat">🗂 加分类</button>
          <button class="btn ghost grow sm" id="manCat">✏️ 管分类</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.pen()}</span>我的点评 <small>${getReviews().length} 篇</small></div>
        <div id="revList"></div>
        <button class="btn block" id="addRev" style="margin-top:9px;">${Icons.plus()}写一条点评</button>
      </div>`;
    drawChips();
    drawRecs($('#recGrid'));
    $('#catGrp').onclick = (e) => { const c = e.target.closest('[data-c]'); if (!c) return; curCat = c.dataset.c; drawChips(); drawRecs($('#recGrid')); };
    $('#addWork').onclick = addWork;
    $('#addCat').onclick = addCat;
    $('#manCat').onclick = manCat;
    drawReviews($('#revList'));
    $('#addRev').onclick = addReview;
  }

  function drawChips() {
    const cats = getRecs();
    const list = ['全部', ...cats.map(c => c.cat)];
    $('#catGrp').innerHTML = list.map(c =>
      `<button class="chip sm ${curCat === c ? 'on' : ''}" data-c="${esc(c)}">${c === '全部' ? '🌟 全部' : (cats.find(x => x.cat === c).emoji + ' ' + esc(c))}</button>`).join('');
  }

  function drawRecs(box) {
    const items = itemsOf(curCat);
    if (!items.length) { box.innerHTML = `<div class="empty"><div class="e-ico">${Icons.rabbit()}</div>这个分类还没有作品～<br>点“加作品”添加你想安利的</div>`; return; }
    box.innerHTML = items.map(it => {
      const base = genPoster(it); // 兜底用生成的精美海报
      const poster = it.img || (navigator.onLine && it.online ? it.online : base);
      return `<div class="mcard" data-id="${it.id}">
        <div class="mimg-wrap">
          <img class="mimg" src="${poster}" alt="" data-base="${base}" onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src=this.dataset.base;}">
        </div>
        <div class="mt">${esc(it.title)}</div>
        <div class="row" style="margin:3px 9px 0;gap:5px;flex-wrap:wrap;">
          <span class="chip sm on">${esc(it.type)}</span>
          ${it.tag ? `<span class="hint" style="font-size:10px;">${esc(it.tag)}</span>` : ''}
        </div>
        <div class="ms">${esc(it.desc || '')}</div>
        <div class="row" style="margin:5px 9px 0;gap:8px;align-items:center;">
          ${it.hot ? `<span class="hint" style="font-size:10px;">🔥 ${it.hot}</span>` : ''}
          <span class="chip sm" data-act="del" style="margin-left:auto;">× 删除</span>
        </div>
      </div>`;
    }).join('');
    box.onclick = async (e) => {
      const card = e.target.closest('[data-id]'); if (!card) return;
      if (e.target.dataset.act === 'del') {
        const cat = getRecs().find(c => c.items.some(x => x.id === card.dataset.id));
        if (cat && await confirmBox('删除这部推荐？', '删除')) {
          cat.items = cat.items.filter(x => x.id !== card.dataset.id); setRecs(getRecs()); drawChips(); drawRecs($('#recGrid'));
        }
      }
    };
    // 联网时异步增强封面为真实图片
    setTimeout(() => enhanceCovers(box), 300);
  }

  function addWork() {
    const cats = getRecs();
    modal.open('添加一部作品', `
      <select class="field" id="wCat">${cats.map(c => `<option value="${esc(c.cat)}">${c.emoji} ${esc(c.cat)}</option>`).join('')}</select>
      <input class="field" id="wTitle" style="margin-top:8px;" placeholder="作品名称">
      <div class="row" style="margin-top:8px;gap:6px;">
        <select class="field grow" id="wType">${Object.keys(TYPE_EMO).map(t => `<option>${t}</option>`).join('')}</select>
        <input class="field" id="wHot" style="width:74px;" type="number" step="0.1" min="0" max="10" placeholder="热度">
      </div>
      <input class="field" id="wTag" style="margin-top:8px;" placeholder="标签，如：治愈·奇幻">
      <textarea class="field" id="wDesc" style="margin-top:8px;min-height:60px;" placeholder="一句话安利…"></textarea>
      <button class="btn ghost block sm" id="wImg" style="margin-top:8px;">${Icons.photo()}选一张封面图（可选）</button>
      <div id="wImgPrev" style="margin-top:6px;"></div>
      <div class="row" style="margin-top:12px;">
        <button class="btn ghost grow" id="wNo">取消</button>
        <button class="btn grow" id="wYes">添加</button>
      </div>`, (b) => {
      let img = '';
      $('#wNo', b).onclick = () => modal.close();
      $('#wImg', b).onclick = async () => {
        const im = await pickImage(700);
        if (im) { img = im; $('#wImgPrev', b).innerHTML = `<img src="${img}" style="width:100%;border-radius:10px;">`; }
      };
      $('#wYes', b).onclick = () => {
        const title = $('#wTitle', b).value.trim();
        if (!title) { toast('写个名字吧'); return; }
        const hot = parseFloat($('#wHot', b).value);
        const cat = getRecs().find(c => c.cat === $('#wCat', b).value);
        cat.items.unshift({ id: uid(), title, type: $('#wType', b).value, tag: $('#wTag', b).value.trim(), hot: isNaN(hot) ? 0 : hot, desc: $('#wDesc', b).value.trim(), img });
        setRecs(getRecs()); modal.close(); drawChips(); drawRecs($('#recGrid')); toast('已添加 🎬');
      };
    });
  }

  function addCat() {
    promptBox('新分类名称', '', '如：悬疑、纪录片…').then(async (name) => {
      if (!name) return;
      const cats = getRecs();
      if (cats.some(c => c.cat === name)) { toast('已有这个分类啦'); return; }
      const emo = (await promptBox('给这个分类选个 emoji', '🎬', '粘贴一个 emoji')) || '🎬';
      cats.push({ cat: name, emoji: emo, items: [] });
      setRecs(cats); curCat = name; drawChips(); drawRecs($('#recGrid')); toast('分类已添加');
    });
  }

  function manCat() {
    const cats = getRecs();
    modal.open('管理分类', `
      <div id="catList"></div>
      <div class="hint" style="margin-top:6px;">删除分类会同时删除该分类下的作品。</div>`, (b) => {
      const box = $('#catList', b);
      box.innerHTML = cats.map(c => `
        <div class="row" style="margin-bottom:6px;">
          <span style="font-size:16px;">${c.emoji}</span>
          <span class="grow" style="font-size:13px;font-weight:700;">${esc(c.cat)} <span class="hint">${c.items.length} 部</span></span>
          <span class="chip sm" data-del="${esc(c.cat)}">删除</span>
        </div>`).join('');
      $$('#catList [data-del]', b).forEach(x => x.onclick = async () => {
        if (await confirmBox(`删除分类「${x.dataset.del}」及其作品？`, '删除')) {
          setRecs(getRecs().filter(c => c.cat !== x.dataset.del));
          if (curCat === x.dataset.del) curCat = '全部';
          manCat(); drawChips(); drawRecs($('#recGrid'));
        }
      });
    });
  }

  function stars(n) {
    n = Math.max(0, Math.min(5, n | 0));
    let s = '';
    for (let i = 1; i <= 5; i++) s += i <= n ? '★' : '<span class="off">☆</span>';
    return `<span class="stars">${s}</span>`;
  }

  function drawReviews(box) {
    const reviews = getReviews().slice().sort((a, b) => b.ts - a.ts);
    if (!reviews.length) { box.innerHTML = `<div class="empty"><div class="e-ico">${Icons.chick()}</div>还没有点评～<br>看完一部好作品，来记一笔吧</div>`; return; }
    box.innerHTML = reviews.map(rv => `
      <div class="rec-item" data-id="${rv.id}">
        <div class="rec-ico">${emoOf(rv.type)}</div>
        <div class="rec-main">
          <div class="t">${esc(rv.title)} ${stars(rv.rating || 0)}</div>
          <div class="s">${esc(rv.text || '')}</div>
          ${rv.imgs && rv.imgs.length ? `<div class="rthumbs">${rv.imgs.map(i => `<img src="${i}">`).join('')}</div>` : ''}
          <div class="hint" style="margin-top:2px;">${niceDate(rv.date)}${rv.type ? ' · ' + esc(rv.type) : ''}</div>
        </div>
        <span class="chip sm" data-act="del">×</span>
      </div>`).join('');
    box.onclick = async (e) => {
      const it = e.target.closest('[data-id]'); if (!it) return;
      if (e.target.dataset.act === 'del') {
        if (await confirmBox('删除这条点评？', '删除')) { setReviews(getReviews().filter(x => x.id !== it.dataset.id)); drawReviews($('#revList')); }
      }
    };
  }

  function addReview() {
    modal.open('写一条点评', `
      <input class="field" id="vTitle" placeholder="作品名称">
      <div class="row" style="margin-top:8px;gap:6px;">
        <select class="field grow" id="vType">${Object.keys(TYPE_EMO).map(t => `<option>${t}</option>`).join('')}</select>
        <div class="grow row" style="gap:2px;justify-content:flex-end;" id="vStars"></div>
      </div>
      <div class="hint" style="margin-top:2px;">点击星星打分（1–5）</div>
      <textarea class="field" id="vText" style="margin-top:8px;min-height:80px;" placeholder="你的心得、体会、名场面…"></textarea>
      <button class="btn ghost block sm" id="vImg" style="margin-top:8px;">${Icons.photo()}添加图片（最多 3 张）</button>
      <div class="rthumbs" id="vImgPrev" style="margin-top:6px;"></div>
      <div class="row" style="margin-top:12px;">
        <button class="btn ghost grow" id="vNo">取消</button>
        <button class="btn grow" id="vYes">保存</button>
      </div>`, (b) => {
      let rating = 0; const imgs = [];
      const drawStars = () => {
        $('#vStars', b).innerHTML = [1, 2, 3, 4, 5].map(i => `<span data-st="${i}" style="font-size:20px;cursor:pointer;color:${i <= rating ? 'var(--orange-d)' : 'var(--grey)'};">${i <= rating ? '★' : '☆'}</span>`).join('');
        $$('#vStars span', b).forEach(s => s.onclick = () => { rating = +s.dataset.st; drawStars(); });
      };
      drawStars();
      $('#vNo', b).onclick = () => modal.close();
      $('#vImg', b).onclick = async () => {
        if (imgs.length >= 3) { toast('最多 3 张啦'); return; }
        const im = await pickImage(800);

  /* 数据 */
  const DB_KEY = 'travel';

  /* 文本截断（按字符数，含中文）前 n 字 + 省略号 */
  function cutN(s, n) {
    if (!s) return '';
    const a = Array.from(String(s).trim());
    return a.length > n ? a.slice(0, n).join('') + '…' : a.join('');
  }

  /* 图片文件 → dataURL（压缩到合适尺寸，避免撑爆 IndexedDB） */
  function fileToDataURL(file, maxW, cb) {
    if (!file || !/^image\//.test(file.type)) { cb(null); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const w = img.width, h = img.height;
        const scale = Math.min(1, maxW / w);
        const cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
        try {
          const cv = document.createElement('canvas');
          cv.width = cw; cv.height = ch;
          cv.getContext('2d').drawImage(img, 0, 0, cw, ch);
          cb(cv.toDataURL('image/jpeg', 0.82));
        } catch (_) { cb(reader.result); }
      };
      img.onerror = () => cb(reader.result);
      img.src = reader.result;
    };
    reader.onerror = () => cb(null);
    reader.readAsDataURL(file);
  }

  /* 城市坐标查询 */
  function cityPos(region, name) {
    if (region === 'china' && window.CN_ROOSTER) {
      const idx = window.CN_ROOSTER.CITY_INDEX || [];
      let hit = idx.find(c => c.name === name);
      if (!hit) hit = idx.find(c => name && (c.name.includes(name) || name.includes(c.name)));
      return hit ? { x:hit.x, y:hit.y, prov:hit.prov } : null;
    }
    // 其他大洲：返回该区域内的随机位置
    const bounds = {
      asia:{x:340,y:260,w:200,h:180}, europe:{x:260,y:200,w:140,h:150},
      na:{x:180,y:180,w:160,h:160}, sa:{x:180,y:280,w:100,h:180},
      africa:{x:220,y:260,w:140,h:180}, oceania:{x:220,y:200,w:160,h:120}
    };
    const b = bounds[region] || {x:220,y:200,w:200,h:150};
    return { x: b.x + Math.random()*b.w, y: b.y + Math.random()*b.h };
  }

  /* 地图框宽高比：依据该区域 viewBox，框固定比例不随缩放变化 */
  function frameRatio(region) {
    if (region === 'china' && window.CN_ROOSTER) {
      const vb = window.CN_ROOSTER.vb; return (vb[2] / vb[3]).toFixed(3);
    }
    const c = CONTINENT_MAPS[region];
    if (c && c.vb) { const p = c.vb.split(' ').map(Number); return (p[2] / p[3]).toFixed(3); }
    return '1.19';
  }

  /* 简单路径中心估算（取所有点的平均） */
  function simpleCenter(d) {
    const nums = d.match(/[-\d.]+/g);
    if (!nums || nums.length < 4) return {x:200,y:200};
    let sx=0,sy=0,cnt=0;
    for (let i=0;i<nums.length-1;i+=2) {
      sx+=parseFloat(nums[i]); sy+=parseFloat(nums[i+1]); cnt++;
    }
    return {x: sx/cnt, y: sy/cnt};
  }

  /* 缩放/平移交互（仅中国地图）—— 基于 viewBox 缩放，地名/标记保持清晰可读大小 */
  function bindZoomPan(svg) {
    if (!svg) return;
    const vb = (window.CN_ROOSTER && window.CN_ROOSTER.vb) || [0,0,1000,840];
    const VW = vb[2], VH = vb[3], VX = vb[0], VY = vb[1];
    let zs = 1, zcx = VX + VW/2, zcy = VY + VH/2;
    const clamp = (v,a,b) => Math.min(b, Math.max(a, v));

    function apply() {
      const w = VW/zs, h = VH/zs;
      svg.setAttribute('viewBox', `${(zcx-w/2).toFixed(2)} ${(zcy-h/2).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)}`);
      // 文本与城市点保持“屏幕恒定大小”：除以当前缩放比
      const k = (1/zs).toFixed(3);
      svg.querySelectorAll('text[data-base]').forEach(t => t.setAttribute('font-size', (parseFloat(t.dataset.base) * k).toFixed(2)));
      svg.querySelectorAll('.city-dot').forEach(c => c.setAttribute('r', (2.6 * k).toFixed(2)));
      svg.classList.toggle('zoomed', zs > 1.4);
      svg.classList.toggle('hide-prov', zs > 1.9);
    }
    function clientToWorld(e) {
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const m = svg.getScreenCTM(); if (!m) return null;
      return pt.matrixTransform(m.inverse());
    }
    function zoomAt(wx, wy, factor) {
      const ns = clamp(zs * factor, 1, 6);
      const ratio = ns / zs;
      zcx = wx + (zcx - wx) / ratio;
      zcy = wy + (zcy - wy) / ratio;
      zs = ns; apply();
    }
    function centerOn(x, y, s) {
      zs = clamp(s, 1, 6); zcx = x; zcy = y; apply();
    }
    window.__cnCenterOn = centerOn;

    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      const wpt = clientToWorld(e);
      if (wpt) zoomAt(wpt.x, wpt.y, e.deltaY < 0 ? 1.3 : 1/1.3);
    }, { passive: false });

    let dragging = false, lastX = 0, lastY = 0, downX = 0, downY = 0;
    svg.addEventListener('pointerdown', (e) => {
      dragging = true; moved = false;
      lastX = e.clientX; lastY = e.clientY; downX = e.clientX; downY = e.clientY;
      svg.style.cursor = 'grabbing';
      try { svg.setPointerCapture(e.pointerId); } catch (_) {}
    });
    svg.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const rect = svg.getBoundingClientRect();
      const dx = (e.clientX - lastX) / rect.width * (VW/zs);
      const dy = (e.clientY - lastY) / rect.height * (VH/zs);
      zcx -= dx; zcy -= dy; lastX = e.clientX; lastY = e.clientY;
      if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 4) moved = true;
      apply();
    });
    function endDrag(e) {
      dragging = false; svg.style.cursor = 'grab';
      try { svg.releasePointerCapture(e.pointerId); } catch (_) {}
    }
    svg.addEventListener('pointerup', endDrag);
    svg.addEventListener('pointercancel', endDrag);
    svg.addEventListener('click', (e) => {
      if (moved) return;
      const marker = e.target.closest('.city-marker');
      if (marker) { showCityDetail(marker.dataset.id); return; }
      showAddCity();
    });

    const zin = document.getElementById('mapZoomIn');
    const zout = document.getElementById('mapZoomOut');
    const zreset = document.getElementById('mapZoomReset');
    if (zin) zin.onclick = () => { const c = svg.viewBox.baseVal; zoomAt(c.x + c.width/2, c.y + c.height/2, 1.5); };
    if (zout) zout.onclick = () => { const c = svg.viewBox.baseVal; zoomAt(c.x + c.width/2, c.y + c.height/2, 1/1.5); };
    if (zreset) zreset.onclick = () => { zs = 1; zcx = VX + VW/2; zcy = VY + VH/2; apply(); };
    apply();
  }

          </div>

            <label style="font-size:.85rem;color:#8C6647;display:block;margin-bottom:4px;">📅 到访日期</label>
            <input id="ciDate" type="date" value="${isEdit?(existing.date||today()):today()}" style="width:100%;box-sizing:border-box;padding:8px 12px;border:2px solid #E8D9BC;border-radius:8px;font-size:.95rem;background:#FFFBF5;">
          </div>
          <div style="margin-top:12px;">
            <label style="font-size:.85rem;color:#8C6647;display:block;margin-bottom:4px;">👫 遇到的人</label>
            <textarea id="ciMeet" rows="2" placeholder="旅途中遇见的有趣的人..." style="width:100%;box-sizing:border-box;padding:8px 12px;border:2px solid #E8D9BC;border-radius:8px;font-size:.92rem;background:#FFFBF5;resize:vertical;font-family:inherit;">${g('meet')}</textarea>
          </div>
          <div style="margin-top:10px;">
            <label style="font-size:.85rem;color:#8C6647;display:block;margin-bottom:4px;">💡 遇到的事</label>
            <textarea id="ciEvent" rows="2" placeholder="路上发生的故事、趣事..." style="width:100%;box-sizing:border-box;padding:8px 12px;border:2px solid #E8D9BC;border-radius:8px;font-size:.92rem;background:#FFFBF5;resize:vertical;font-family:inherit;">${g('event')}</textarea>
          </div>
          <div style="margin-top:10px;">
            <label style="font-size:.85rem;color:#8C6647;display:block;margin-bottom:4px;">🍜 吃到的美食</label>
            <textarea id="ciFood" rows="2" placeholder="好吃的当地小吃、餐厅..." style="width:100%;box-sizing:border-box;padding:8px 12px;border:2px solid #E8D9BC;border-radius:8px;font-size:.92rem;background:#FFFBF5;resize:vertical;font-family:inherit;">${g('food')}</textarea>
          </div>
          <div style="margin-top:10px;">
            <label style="font-size:.85rem;color:#8C6647;display:block;margin-bottom:4px;">🏞️ 看到的风景</label>
            <textarea id="ciScenery" rows="2" placeholder="难忘的风景、日落、街角..." style="width:100%;box-sizing:border-box;padding:8px 12px;border:2px solid #E8D9BC;border-radius:8px;font-size:.92rem;background:#FFFBF5;resize:vertical;font-family:inherit;">${g('scenery')}</textarea>
          </div>
          <div style="margin-top:12px;">
            <label style="font-size:.85rem;color:#8C6647;display:block;margin-bottom:4px;">🖼️ 上传图片</label>
            <input id="ciImg" type="file" accept="image/*" multiple style="width:100%;font-size:.85rem;color:#6B4630;">
            <div id="ciImgPrev" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;"></div>
          </div>
          <div style="margin-top:16px;display:flex;gap:8px;">
            <button class="btn primary" id="ciSave" style="flex:1">✅ 保存</button>
            ${isEdit?'<button class="btn" id="ciDel" style="flex:0 0 auto;color:#c0392b;border-color:#e7a;">🗑 删除</button>':''}
            <button class="btn" id="ciCancel" style="flex:1">取消</button>
          </div>
        </div>
      </div>`;
    document.body.insertAdjacentHTML('beforeend', html);

    /* 图片上传：压缩 + 预览 + 删除 */
    let curImgs = existing && existing.images ? existing.images.slice() : [];
    const imgPrev = $('#ciImgPrev');
    function renderImgPrev() {
      if (!imgPrev) return;
      imgPrev.innerHTML = curImgs.map((src,i) =>
        `<div class="img-thumb" data-i="${i}"><img src="${src}" alt=""><span class="img-x" data-i="${i}">×</span></div>`
      ).join('');
      imgPrev.querySelectorAll('.img-x').forEach(x => x.onclick = () => {
        curImgs.splice(+x.dataset.i, 1); renderImgPrev();
      });
    }
    renderImgPrev();
    const ciImg = $('#ciImg');
    if (ciImg) ciImg.onchange = (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      files.forEach(f => fileToDataURL(f, 1200, (url) => { if (url) { curImgs.push(url); renderImgPrev(); } }));
      e.target.value = '';
    };

    $('#ciSave').onclick = () => {
      const name = $('#ciName').value.trim();
      if (!name) return toast('请输入地名');
      const rec = {
        id: isEdit ? existing.id : uid(),
        name, date: $('#ciDate').value, region: curRegion,
        meet: $('#ciMeet').value.trim(), event: $('#ciEvent').value.trim(),
        food: $('#ciFood').value.trim(), scenery: $('#ciScenery').value.trim(),
        images: curImgs.slice(),
        notes: existing && existing.notes ? existing.notes : []  // 兼容旧数据
      };
      data.cities = data.cities || [];
      if (isEdit) {
        const i = data.cities.findIndex(c => c.id === existing.id);
        if (i >= 0) data.cities[i] = rec;
      } else {
        data.cities.push(rec);
      }
      set(data);
      $('#cityDlg').remove();
      paint();
      toast(isEdit ? '🐾 已更新！' : '🐾 足迹已点亮！');
    };
    $('#ciCancel').onclick = () => $('#cityDlg').remove();
    if (isEdit) $('#ciDel').onclick = () => {
      if (!confirmBox('删除这个足迹？')) return;
      data.cities = data.cities.filter(c => c.id !== existing.id);
      set(data); $('#cityDlg').remove(); paint(); toast('已删除');
    };
  }

  /* 城市详情（展示分类游记，可点编辑） */
  const CAT_DEFS = [['👫','meet','遇到的人'],['💡','event','遇到的事'],['🍜','food','吃到的美食'],['🏞️','scenery','看到的风景']];
  function showCityDetail(id) {
    const data = get();
    const city = (data.cities||[]).find(c=>c.id===id);
    if (!city) return;
    const dlg = document.createElement('div');
    dlg.id = 'cityDetail';
    dlg.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900;display:flex;align-items:center;justify-content:center;';
    const cats = CAT_DEFS.map(([ic,k,label]) => city[k] ? `
      <div class="food-item" style="padding:10px 12px;margin-bottom:6px;">
        <div style="font-weight:600;color:#E07B20;">${ic} ${label}</div>
        <div style="font-size:.9rem;color:#4A3628;margin-top:3px;white-space:pre-wrap;line-height:1.5;">${esc(city[k])}</div>
      </div>` : '').join('');
    const imgs = (city.images||[]).length ? `
      <div class="city-img-gallery" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;">
        ${(city.images||[]).map(src=>`<img class="city-img" src="${src}" alt="" style="width:74px;height:74px;object-fit:cover;border-radius:8px;border:1px solid #E8D9BC;">`).join('')}
      </div>` : '';
    dlg.innerHTML = `
      <div class="card" style="max-width:480px;width:94%;max-height:85vh;overflow-y:auto;padding:20px;">
        <div class="card-title"><span class="ci">${Icons.paw()}</span>${esc(city.name)} <small style="color:#9A8874;font-weight:normal">${city.date||''} · ${REGION_VIEWS[city.region]?REGION_VIEWS[city.region].name:''}</small></div>
        ${imgs}
        ${cats || '<p style="color:#9A8874;font-size:.85rem;margin-top:8px;">这次旅行还没记录任何内容～</p>'}
        <div style="margin-top:14px;display:flex;gap:8px;">
          <button class="btn primary" id="dlgEdit" style="flex:1">✏️ 编辑</button>
          <button class="btn" id="dlgClose" style="flex:1">关闭</button>
        </div>
      </div>`;
    document.body.appendChild(dlg);
    $('#dlgEdit').onclick = () => { dlg.remove(); showCityDialog(city); };
    $('#dlgClose').onclick = () => dlg.remove();
  }

  /* 主渲染 */
  function paint() {
    const pane = $('#trPane'); if(!pane)return;
    const data = get();
    const isCN = curRegion === 'china' && !!window.CN_ROOSTER;

    pane.innerHTML = `
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap;">
        ${Object.entries(REGION_VIEWS).map(([k,v]) =>
          `<button class="chip sm ${curRegion===k?'on':''}" data-r="${k}">${v.name}</button>`
        ).join('')}
      </div>

      ${isCN ? `
      <div style="display:flex;gap:6px;margin-bottom:8px;align-items:center;flex-wrap:wrap;">
        <input id="citySearch" type="text" placeholder="🔍 搜索城市/县城，定位并点亮足迹" style="flex:1;min-width:160px;padding:7px 10px;border:2px solid #E8D9BC;border-radius:8px;font-size:.88rem;background:#FFFBF5;">
        <button class="chip sm" id="citySearchBtn" style="background:${document.documentElement.style.getPropertyValue('--orange')||'#F2A340'};color:#fff;border:none;">定位</button>
      </div>` : ''}

      <!-- 地图区域：固定比例框，缩放只在框内发生 -->
      <div id="mapArea" class="travel-map" style="aspect-ratio:${frameRatio(curRegion)};"></div>

      <div style="margin-top:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;">
        <span style="font-size:.8rem;color:#9A8874;">已点亮 ${(data.cities||[]).filter(c=>c.region===curRegion).length} 个足迹 🐾${isCN?' ｜ 滚轮缩放 / 拖拽平移':''}</span>
        <button class="chip sm" id="addCityBtn" style="background:${document.documentElement.style.getPropertyValue('--orange')||'#F2A340'};color:#fff;border:none;">＋ 添加足迹</button>
      </div>

      <!-- 时间轴：只用它来体现足迹 -->
      <div style="margin-top:16px;">
        <b style="font-size:.9rem">🕒 足迹时间轴</b>
        <div id="timeline" style="margin-top:8px;">
          ${renderTimeline(data, curRegion)}
        </div>
      </div>
    `;

    renderMapSVG($('#mapArea'), curRegion);

    // 区域切换
    $$('#trPane .chip[data-r]').forEach(btn => {
      btn.onclick = () => { curRegion = btn.dataset.r; paint(); };
    });
    $('#addCityBtn').onclick = () => showCityDialog(null);
    $$('#timeline .tl-item').forEach(el => {
      el.onclick = () => showCityDetail(el.dataset.id);
    });

    // 搜索定位（中国）
    if (isCN) {
      const doSearch = () => {
        const q = $('#citySearch').value.trim();
        if (!q) return;
        const idx = (window.CN_ROOSTER && window.CN_ROOSTER.CITY_INDEX) || [];
        let hit = idx.find(c => c.name === q) || idx.find(c => c.name.includes(q) || q.includes(c.name));
        if (hit && window.__cnCenterOn) {
          window.__cnCenterOn(hit.x, hit.y, 4);
          showCityDialog(null, hit.name);
        } else {
          toast('未找到该地名，试试输入省份或城市名（如：广东省、杭州市）');
        }
      };
      $('#citySearchBtn').onclick = doSearch;
      $('#citySearch').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
    }
  }

  /* 时间轴：日记式 —— 左侧纵向时间轴(日期+地点)，右侧卡片(分类前15字+图片)，右下「走进故事」 */
  function renderTimeline(data, region) {
    const items = (data.cities||[])
      .filter(c => c.region === region)
      .slice()
      .sort((a,b) => (b.date||'').localeCompare(a.date||''));
    if (!items.length) return '<p style="color:#9A8874;font-size:.82rem;margin-top:6px;">还没有足迹，点地图或「＋ 添加足迹」记录第一站吧～</p>';
    return `<div class="tl-diary">` + items.map(c => {
      const cats = CAT_DEFS.map(([ic,k,label]) => c[k] ? `
        <div class="tl-cat"><span class="tl-ic">${ic}</span><span class="tl-txt">${cutN(c[k], 15)}</span></div>` : '').join('');
      const hasImg = c.images && c.images.length;
      const photo = hasImg
        ? `<div class="tl-photo"><img src="${c.images[0]}" alt=""></div>`
        : `<div class="tl-photo empty">📷</div>`;
      return `<div class="tl-item" data-id="${c.id}">
        <div class="tl-axis">
          <div class="tl-dot"></div>
          <div class="tl-date">${c.date||'未填日期'}</div>
          <div class="tl-place">🐾 ${esc(c.name)}</div>
        </div>
        <div class="tl-card">
          <div class="tl-row">
            <div class="tl-texts">${cats || '<span class="tl-empty">（这次还没写点什么）</span>'}</div>
            ${photo}
          </div>
          <div class="tl-foot"><span class="tl-more">走进故事 →</span></div>
        </div>
      </div>`;
    }).join('') + `</div>`;
  }

  function render(root) {
    root.innerHTML = `<div id="trPane"></div>`;
    paint();
  }

  window.Modules = window.Modules || {};
  window.Modules.travel = { id: 'travel', name: '走走停停', desc: '用猫爪点亮世界每个角落', icon: 'horse', render };
})();

</script>
<script>
// 健康管理 —— 小鸡守护你的身体（可爱风）
(function () {
  const DB_KEY = 'health';
  // 分类定义
  const CATS = {
    gi: { name:'🤢 肠胃不适', icon:'🤢', color:'#E07B20',
      opts:['拉肚子','胃痛','肚子胀','便秘','肚子疼','恶心反胃','食欲不振'] },
    ext: { name:'🤒 外感内热', icon:'🤒', color:'#D4A017',
      opts:['风寒感冒','风热感冒','发烧','喉咙痛','湿热内停','咳嗽流涕','头晕头痛'] },
    ms: { name:'💪 筋骨肉痛', icon:'💪', color:'#5B8C6A',
      opts:['手腕腱鞘炎','肩关节劳损','上背部不适','手臂麻木','腿部麻木','下肢水肿','屁股两侧痛','颈椎不适'] }
  };

  /* 数据结构 */
  const get = () => DB.get(DB_KEY, { records:[], customs:{} });
  const set = (v) => DB.set(DB_KEY, v);
  function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  function today() { return new Date().toISOString().slice(0,10); }

  // 颜色加深（选中态更明显）
  function darken(hex, f) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex); if (!m) return hex;
    const n = parseInt(m[1], 16);
    let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
    r = Math.round(r*(1-f)); g = Math.round(g*(1-f)); b = Math.round(b*(1-f));
    return '#' + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }

  /* ===== 主渲染 ===== */
  let view = 'today'; // today | month | year
  let selDate = today();
  let curCat = 'gi';

  function render(root) {
    root.innerHTML = `
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap;">
        <span class="chip on" id="hdToday" style="font-weight:700;background:${document.documentElement.style.getPropertyValue('--orange')||'#F2A340'};color:#fff;">📅 今天</span>
        <span class="chip sm" id="hdMonth">📆 月历</span>
        <span class="chip sm" id="hdYear">📊 年历</span>
      </div>

      <!-- 日期显示 -->
      <div id="hdDateBar" style="text-align:center;padding:8px;background:#FFFBF5;border-radius:10px;border:2px dashed #E8D9BC;margin-bottom:12px;">
        <div style="font-size:1.15rem;font-weight:700;color:#6B4630;" id="hdDateText">${formatDate(selDate)}</div>
        <div style="font-size:.78rem;color:#9A8874;margin-top:2px;" id="hdWeekday">${weekday(selDate)}</div>
      </div>

      <!-- 分类切换（三个分类均可点击切换，选中态加深） -->
      <div id="hdCats" style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
        ${Object.entries(CATS).map(([k,v]) => {
          const on = curCat===k;
          const style = on ? `background:${darken(v.color,0.18)};color:#fff;border:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.28),0 2px 4px rgba(0,0,0,.12);font-weight:700;` : `background:#FFFDF8;color:${v.color};border:1.5px solid ${v.color};`;
          return `<button class="chip ${on?'on':''}" data-cat="${k}" style="${style}">${v.name}</button>`;
        }).join('')}
      </div>

      <div id="hdPane"></div>
    `;

    $('#hdToday').onclick = () => { view='today'; selDate=today(); render(root); };
    $('#hdMonth').onclick = () => { view='month'; render(root); };
    $('#hdYear').onclick = () => { view='year'; render(root); };

    $$('#hdCats [data-cat]').forEach(btn => {
      btn.onclick = () => { curCat = btn.dataset.cat; render(root); };
    });

    paintPane();
  }

  function paintPane() {
    const pane = $('#hdPane'); if(!pane)return;
    if (view === 'today' || view === 'month') {
      renderRecordForm(pane);
    } else if (view === 'year') {
      renderYearView(pane);
    }
  }

  /* ===== 记录表单 ===== */
  function renderRecordForm(pane) {
    const cat = CATS[curCat];
    const data = get();
    const customs = data.customs[curCat] || [];
    const allOpts = [...cat.opts, ...customs];

    // 当日已有记录
    const dayRecs = (data.records||[]).filter(r => r.date === selDate && r.cat === curCat);

    pane.innerHTML = `
      <!-- 状态选择 -->
      <div style="margin-bottom:10px;">
        <label style="font-size:.85rem;color:${cat.color};font-weight:600;display:block;margin-bottom:4px;">${cat.icon} 状态选择</label>
        <div id="hdStatusGrid" style="display:flex;flex-wrap:wrap;gap:6px;">
          ${allOpts.map((o,i) => `<button class="chip sm hd-st-opt" data-v="${o}" style="${dayRecs.some(r=>r.status===o)?`background:${cat.color};color:#fff;border:none;`:''}">${esc(o)}</button>`).join('')}
          <button class="chip sm" id="hdAddCustom" style="border:2px dashed #B8A484;color:#9A8874;">＋ 自定义</button>
        </div>
      </div>

      <!-- 不适感打分 -->
      <div style="margin-bottom:10px;">
        <label style="font-size:.85rem;color:${cat.color};font-weight:600;display:block;margin-bottom:4px;">😖 不适感打分 <small style="font-weight:normal;color:#9A8874;">(1-10，10最难受)</small></label>
        <div id="hdScoreBar" style="display:flex;align-items:center;gap:6px;">
          <input type="range" id="hdScore" min="1" max="10" value="${dayRecs.length?dayRecs[0].score||5:5}" style="flex:1;accent-color:${cat.color};" />
          <span id="hdScoreVal" style="font-size:1.1rem;font-weight:700;color:${cat.color};min-width:24px;text-align:center;">${dayRecs.length?dayRecs[0].score||5:5}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:.7rem;color:#9A8874;margin-top:2px;">
          <span>轻微</span><span>难以忍受</span>
        </div>
      </div>

      <!-- 回忆溯源 -->
      <div style="margin-bottom:10px;">
        <label style="font-size:.85rem;color:${cat.color};font-weight:600;display:block;margin-bottom:4px;">🔍 回忆溯源</label>
        <textarea id="hdTrace" rows="3" placeholder="记录一下今天吃了什么、做了什么、可能是什么原因导致不舒服..." style="width:100%;box-sizing:border-box;padding:8px 10px;border:2px solid #E8D9BC;border-radius:8px;background:#FFFBF5;resize:vertical;font-size:.9rem;line-height:1.5;">${dayRecs.length?esc(dayRecs[0].trace||''):''}</textarea>
      </div>

      <!-- 保存按钮 -->
      <button class="btn primary" id="hdSaveBtn" style="width:100%;padding:10px;font-size:1rem;">${Icons.chick()} 保存今日记录</button>

      <!-- 当日已有记录列表 -->
      ${dayRecs.length?`<div style="margin-top:14px;"><b style="font-size:.88rem">📋 今日已记录 (${dayRecs.length}条)</b><div style="margin-top:4px;">${dayRecs.map((r,i)=>`
        <div class="food-item" style="padding:8px 10px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <span class="chip sm" style="background:${cat.color};color:#fff;border:none;font-size:.78rem;">${r.status}</span>
            <span style="color:#E07B20;font-weight:600;margin-left:4px;">${r.score}/10</span>
            ${r.trace?`<p style="font-size:.8rem;color:#6B4630;margin-top:3px;">${esc(r.trace)}</p>`:''}
          </div>
          <span class="chip sm" data-act="delRec" data-i="${i}" style="color:#CC6666;border-color:#CC6666;">× 删除</span>
        </div>
      `).join('')}</div></div>`:''}

      <!-- AI 智能汇总避雷 -->
      <div style="margin-top:16px;padding:14px;background:linear-gradient(135deg,#FFF8F0,#FFF3E8);border-radius:12px;border:2px solid #F0D9B8;">
        <div style="font-weight:700;color:#6B4630;margin-bottom:8px;">🐔 AI 智能汇总 · 避雷指南</div>
        <div id="hdAISummary">${renderAISummary(data)}</div>
      </div>
    `;

    // 打分滑块
    $('#hdScore').oninput = () => { $('#hdScoreVal').textContent = $('#hdScore').value; };
    // 状态选择
    $$('.hd-st-opt').forEach(btn => {
      btn.onclick = () => {
        btn.style.background = cat.color;
        btn.style.color = '#fff';
        btn.style.border = 'none';
      };
    });
    // 自定义状态
    $('#hdAddCustom').onclick = () => {
      const val = prompt('输入自定义状态名称：');
      if (!val || !val.trim()) return;
      const v = val.trim();
      data.customs = data.customs || {};
      data.customs[curCat] = data.customs[curCat] || [];
      if (!data.customs[curCat].includes(v)) {
        data.customs[curCat].push(v);
        set(data);
        paintPane();
      }
    };
    // 保存
    $('#hdSaveBtn').onclick = () => {
      const selected = $$('.hd-st-opt').filter(b => b.style.color==='rgb(255, 255, 255)'||b.style.color==='#fff').map(b=>b.dataset.v);
      if (!selected.length && !$('#hdTrace').value.trim()) { toast('请至少选择一个状态或填写溯源'); return; }
      const score = +$('#hdScore').value;
      const trace = $('#hdTrace').value.trim();

      selected.forEach(status => {
        data.records = data.records || [];
        data.records.push({ id:uid(), date:selDate, cat:curCat, status, score, trace, ts:Date.now() });
      });
      // 如果有溯源但没有选状态，也保存一条
      if (!selected.length && trace) {
        data.records.push({ id:uid(), date:selDate, cat:curCat, status:'其他', score, trace, ts:Date.now() });
      }
      set(data);
      toast('🐔 记录已保存！注意身体哦～');
      paintPane();
    };

    // 删除记录
    pane.onclick = (e) => {
      if (e.target.dataset.act === 'delRec') {
        const i = +e.target.dataset.i;
        const dayRecs = (get().records||[]).filter(r => r.date === selDate && r.cat === curCat);
        if (confirmBox('删除这条记录？')) {
          const delId = dayRecs[i].id;
          const d = get();
          d.records = (d.records||[]).filter(r => r.id !== delId);
          set(d);
          paintPane();
        }
      }
    };
  }

  /* ===== 月历视图 ===== */
  function renderMonthView(pane) {
    const [y,m] = selDate.split('-').map(Number);
    const daysInMonth = new Date(y, m, 0).getDate();
    const firstDay = new Date(y, m-1, 1).getDay(); // 0=Sun
    const data = get();
    
    let html = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;">';
    ['日','一','二','三','四','五','六'].forEach(d => html += `<div style="padding:4px;font-size:.75rem;color:#9A8874;font-weight:600;">${d}</div>`);
    for(let i=0;i<firstDay;i++) html += '<div></div>';
    
    for(let d=1;d<=daysInMonth;d++) {
      const ds = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const recs = (data.records||[]).filter(r=>r.date===ds);
      const hasRec = recs.length > 0;
      const isToday = ds === today();
      html += `<div class="cal-day ${isToday?'cal-today':''}" data-d="${ds}" style="padding:6px 2px;border-radius:6px;cursor:pointer;${hasRec?'background:#FFE8D6;border:1.5px solid '+CATS[recs[0].cat].color:''}${isToday&&!hasRec?';border:1.5px solid #F2A340':''}">
        <div style="font-size:.82rem;font-weight:${isToday?'700':'500'};${isToday&&(!hasRec)?'color:#F2A340':''}">${d}</div>
        ${hasRec?`<div style="font-size:.55rem;color:${CATS[recs[0].cat].color};margin-top:1px;">${recs.length}条</div>`:''}
      </div>`;
    }
    html += '</div>';
    
    // 月份导航
    html = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <button class="chip sm" id="mPrev">◀ 上月</button>
        <b style="color:#6B4630;">${y}年${m}月</b>
        <button class="chip sm" id="mNext">下月 ▶</button>
      </div>
      ${html}
      <div id="mDayDetail" style="margin-top:10px;"></div>
    `;

    pane.innerHTML = html;
    $('#mPrev').onclick = () => { selDate = `${y}-${String(m-1||12).padStart(2,'0')}-01`; if(m===1)selDate=`${y-1}-12-01`; paintPane(); };
    $('#mNext').onclick = () => { selDate = `${y}-${String(m+1<=12?m+1:1).padStart(2,'0')}-01`; if(m===12)selDate=`${y+1}-01-01`; paintPane(); };
    
    // 点击日期查看详情
    $$('.cal-day[data-d]').forEach(el => {
      el.onclick = () => {
        $$('.cal-day').forEach(x=>x.style.outline='none');
        el.style.outline = '2px solid #F2A340';
        el.style.outlineOffset = '-1px';
        showDayDetail(el.dataset.d);
      };
    });
  }

  function showDayDetail(ds) {
    const data = get();
    const recs = (data.records||[]).filter(r=>r.date===ds);
    const detail = $('#mDayDetail');
    if (!detail) return;
    if (!recs.length) { detail.innerHTML = `<p style="color:#9A8874;font-size:.84rem;text-align:center;padding:8px;">${ds} 无记录</p>`; return; }
    detail.innerHTML = `
      <div style="font-weight:600;color:#6B4630;margin-bottom:4px;">${formatDate(ds)} 的记录：</div>
      ${recs.map(r=>{
        const cat = CATS[r.cat]||CATS.gi;
        return `<div class="food-item" style="padding:8px;margin-bottom:4px;">
          <span class="chip sm" style="background:${cat.color};color:#fff;border:none;font-size:.76rem;">${cat.icon} ${r.status}</span>
          <span style="color:#E07B20;font-weight:600;margin-left:4px;">${r.score}/10</span>
          ${r.trace?`<p style="font-size:.82rem;color:#4A3628;margin-top:3px;">${esc(r.trace)}</p>`:''}
        </div>`;
      }).join('')}`;
  }

  /* ===== 年历视图 ===== */
  function renderYearView(pane) {
    const y = parseInt(selDate.split('-')[0]);
    const data = get();
    const recs = (data.records||[]).filter(r => r.date.startsWith(y+'-'));
    
    // 按月统计
    const monthStats = Array.from({length:12}, (_,i)=>({
      m:i+1, count:recs.filter(r=>parseInt(r.date.slice(5,7))===i+1).length,
      avgScore: (()=>{const m=recs.filter(r=>parseInt(r.date.slice(5,7))===i+1);return m.length?(m.reduce((a,r)=>a+r.score,0)/m.length).toFixed(1):'-';})(),
      topIssue: (()=>{const m=recs.filter(r=>parseInt(r.date.slice(5,7))===i+1);if(!m.length)return'-';const freq={};m.forEach(r=>{freq[r.status]=(freq[r.status]||0)+1;});return Object.entries(freq).sort((a,b)=>b[1]-a[1])[0][0];})()
    }));

    pane.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <button class="chip sm" id="yPrev">◀ ${y-1}</button>
        <b style="font-size:1.1rem;color:#6B4630;">📊 ${y} 年度健康报告</b>
        <button class="chip sm" id="yNext">${y+1} ▶</button>
      </div>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
        ${monthStats.map(s => {
          const intensity = s.count > 0 ? Math.min(100, s.count*20) : 0;
          const bgColor = s.count > 0 ? `rgba(224,123,32,${intensity/100})` : '#FAF3E8';
          return `<div style="padding:10px;background:${bgColor};border-radius:10px;border:2px solid #E8D9BC;text-align:center;">
            <div style="font-weight:700;color:#6B4630;">${s.m}月</div>
            <div style="font-size:.78rem;color:#9A8874;margin-top:2px;">${s.count}条记录</div>
            ${s.count>0?`<div style="font-size:.72rem;color:#E07B20;">均分 ${s.avgScore}/10</div>
            <div style="font-size:.7rem;color:#8C6647;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(s.topIssue)}</div>`:'<div style="font-size:.72rem;color:#C9BCAA;margin-top:2px;">无异常 ✨</div>'}
          </div>`;
        }).join('')}
      </div>

      <!-- 年度总结 -->
      <div style="margin-top:14px;padding:12px;background:#FFFBF5;border-radius:10px;border:2px solid #E8D9BC;">
        <b style="color:#6B4630;">📈 年度健康概况</b>
        <div style="margin-top:6px;font-size:.86rem;color:#4A3628;line-height:1.7;">
          全年共记录 <b style="color:#E07B20">${recs.length}</b> 条不适<br>
          最常出问题的类别：<b>${renderTopCategory(recs)}</b><br>
          平均不适感：<b style="color:#E07B20">${recs.length?(recs.reduce((a,r)=>a+r.score,0)/recs.length).toFixed(1):'-'}/10</b><br>
          最需关注的月份：<b>${monthStats.sort((a,b)=>b.count-a.count)[0]?.m||'-'}月</b>（${monthStats.sort((a,b)=>b.count-a.count)[0]?.count||0}条）
        </div>
      </div>
    `;

    $('#yPrev').onclick = () => { selDate = `${y-1}-01-01`; paintPane(); };
    $('#yNext').onclick = () => { selDate = `${y+1}-01-01`; paintPane(); };
  }

  function renderTopCategory(recs) {
    const freq = {};
    recs.forEach(r => { const cn = CATS[r.cat]?CATS[r.cat].name:r.cat; freq[cn]=(freq[cn]||0)+1; });
    const sorted = Object.entries(freq).sort((a,b)=>b[1]-a[1]);
    return sorted.length ? sorted[0][0] : '-';
  }

  /* ===== AI 智能汇总避雷 ===== */
  function renderAISummary(data) {
    const records = data.records || [];
    if (records.length === 0) {
      return `<p style="color:#9A8874;font-size:.85rem;line-height:1.6;">还没有健康记录哦～开始记录后，这里会自动生成你的个人避雷指南 🐔✨</p>`;
    }

    // 按状态聚合
    const byStatus = {};
    records.forEach(r => {
      if (!byStatus[r.status]) byStatus[r.status] = [];
      byStatus[r.status].push(r);
    });

    // 取最近30天高频问题
    const thirtyDaysAgo = Date.now() - 30*86400000;
    const recent = records.filter(r => r.ts >= thirtyDaysAgo);

    const recentFreq = {};
    recent.forEach(r => { recentFreq[r.status] = (recentFreq[r.status]||0)+1; });
    const topIssues = Object.entries(recentFreq).sort((a,b)=>b[1]-a[1]).slice(0,5);

    // 按分类给建议
    const suggestions = {
      '拉肚子': '💡 建议：避免生冷食物、注意饮食卫生、少吃油腻辛辣。可喝温盐水补液。',
      '胃痛': '💡 建议：规律三餐、避免空腹吃刺激性食物、少喝浓茶咖啡。可适当喝小米粥养胃。',
      '肚子胀': '💡 建议：细嚼慢咽、避免边吃饭边说话、少吃豆类/碳酸饮料。饭后散步助消化。',
      '便秘': '💡 建议：多喝水、多吃蔬果粗纤维、定时排便。可晨起喝一杯温水。',
      '肚子疼': '💡 建议：记录疼痛位置和规律，如持续加重请及时就医。',
      '风寒感冒': '💡 建议：注意保暖、喝姜汤驱寒、避免吹冷风。多休息多喝热水。',
      '风热感冒': '💡 建议：清淡饮食、多喝水、可喝菊花茶/绿豆汤降火。保持室内通风。',
      '发烧': '⚠️ 建议：多休息补水、物理降温。超过38.5°C或持续不退请就医！',
      '喉咙痛': '💡 建议：少吃辛辣刺激、多喝温水、可用淡盐水漱口。避免用嗓过度。',
      '湿热内停': '💡 建议：饮食清淡、少吃油腻甜食、可吃红豆薏米祛湿。保持环境干燥通风。',
      '手腕腱鞘炎': '💡 建议：减少重复性手部动作、定时休息拉伸、可做握力球康复训练。',
      '肩关节劳损': '💡 建议：避免长时间同一姿势、每小时做肩部环绕运动、注意保暖。',
      '上背部不适': '💡 建议：调整坐姿屏幕高度、做胸椎伸展、避免含胸驼背久坐。',
      '手臂麻木': '⚠️ 建议：检查是否颈椎问题导致，避免长时间低头。如频繁发生建议就医检查。',
      '腿部麻木': '💡 建议：避免久坐久站、定时活动下肢、检查是否有腰椎问题。',
      '下肢水肿': '💡 建议：抬高双腿休息、减少盐分摄入、检查是否循环系统问题。持续请就医。',
      '屁股两侧痛': '💡 建议：换硬一些的座椅、定时起来活动、做臀部拉伸放松。',
      'default': '💡 建议：注意观察规律，找到诱因并尽量避免。规律作息、均衡饮食是基础。'
    };

    let html = '';
    if (topIssues.length) {
      html += `<div style="margin-bottom:10px;"><b style="font-size:.85rem;color:#E07B20;">🔥 近30天高频预警</b><ul style="margin:4px 0 0 16px;padding:0;font-size:.83rem;color:#4A3628;line-height:1.8;">`;
      topIssues.forEach(([status, count]) => {
        const sugg = suggestions[status] || suggestions['default'];
        html += `<li style="margin-bottom:4px;"><b>${esc(status)}</b> ×${count}次<br><span style="color:#8C6647;font-size:.8rem;">${sugg}</span></li>`;
      });
      html += '</ul></div>';
    }

    // 历史溯源汇总
    const traces = records.filter(r=>r.trace).slice(-5).reverse();
    if (traces.length) {
      html += `<div><b style="font-size:.85rem;color:#5B8C6A;">🔍 近期溯源记录</b><div style="margin-top:4px;">`;
      traces.forEach(r => {
        html += `<div style="padding:6px 8px;background:#fff;border-radius:6px;margin-bottom:3px;font-size:.8rem;">
          <span style="color:#9A8874;">${r.date}</span> 
          <span class="chip sm" style="font-size:.7rem;background:${CATS[r.cat]?CATS[r.cat].color:'#999'};color:#fff;border:none;margin-left:4px;">${r.status}</span>
          <p style="color:#4A3628;margin-top:2px;">${esc(r.trace)}</p>
        </div>`;
      });
      html += '</div></div>';
    }

    return html;
  }

  /* 工具函数 */
  function formatDate(d) {
    if (!d) return '';
    const [y,m,day] = d.split('-');
    return `${parseInt(m)}月${parseInt(day)}日`;
  }
  function weekday(d) {
    const days = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    return days[new Date(d+'T00:00:00').getDay()];
  }

  /* 月历视图需要覆盖 paintPane */
  const origPaintPane = paintPane;
  paintPane = function() {
    const pane = $('#hdPane'); if(!pane)return;
    if (view === 'month') { renderMonthView(pane); }
    else if (view === 'year') { renderYearView(pane); }
    else { renderRecordForm(pane); }
  };

  window.Modules = window.Modules || {};
  window.Modules.health = { id: 'health', name: '健康管理', desc: '小鸡守护你的每一天', icon: 'chick', render };
})();

</script>
<script>
/* ===== 设置：数据 · 备份 · 清理 · 显示 ===== */
(function () {
  const { $, $$, esc, today, toast, modal, confirmBox, pickFile, download } = UI;

  function fmt(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1048576).toFixed(2) + ' MB';
  }

  function applyFont(fs) {
    const r = document.documentElement;
    r.classList.remove('fs-s', 'fs-m', 'fs-l');
    r.classList.add('fs-' + (fs || 'm'));
  }

  function applyTheme(t) {
    const r = document.documentElement;
    if (t) r.setAttribute('data-theme', t); else r.removeAttribute('data-theme');
  }

  function applyCompact(on) {
    document.documentElement.classList.toggle('compact', !!on);
  }

  function render(root) {
    const u = DB.usage();
    const top = u.detail.slice(0, 6);
    const fs = DB.get('pref.fontsize', 'm');
    const theme = DB.get('pref.theme', '');
    const compact = DB.get('pref.compact', false);

    root.innerHTML = `
      <div class="card" style="background:linear-gradient(135deg,#EDE3F2,#F7F1E4);border-color:#D9CBE8;">
        <div class="card-title"><span class="ci">${Icons.gear()}</span>设置</div>
        <div class="hint" style="line-height:1.7;">所有数据都保存在你的本机（IndexedDB + 本地备份），刷新、关机都不会丢。删不删，全由你说了算。</div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.book()}</span>存储情况</div>
        <div class="hint">共占用 <b>${fmt(u.total)}</b> 本机空间。</div>
        <div style="margin-top:8px;">${top.length ? top.map(d => `<div class="usage-row"><span class="k">${esc(d.key)}</span><span class="v">${fmt(d.size)}</span></div>`).join('') : '<div class="hint">还没有数据～</div>'}</div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.coin()}</span>数据备份与恢复</div>
        <div class="row" style="gap:8px;">
          <button class="btn ghost grow" id="bk">${Icons.download ? Icons.download() : '⬇'}备份导出</button>
          <button class="btn ghost grow" id="im">${Icons.upload ? Icons.upload() : '⬆'}导入备份</button>
        </div>
        <div class="hint" style="margin-top:7px;">导出会下载一个 JSON 文件，换手机或重装前记得备份。</div>
      </div>

      <div class="card" id="cloudSyncCard" style="display:none;background:linear-gradient(135deg,#E3F2FD,#E8F5E9);border-color:#BBDEFB;">
        <div class="card-title"><span class="ci">☁️</span>云盘同步（桌面版）</div>
        <div class="hint" id="dataPathHint">仅桌面版可用。</div>
        <button class="btn ghost block sm" id="moveCloud">📂 移动到云盘同步文件夹（OneDrive / 百度网盘等）</button>
        <div class="hint" style="margin-top:6px;">把数据文件放进云盘同步文件夹，换电脑自动同步。也可直接把上面的文件拷到网盘。</div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.tv()}</span>影视封面（联网取真实海报）</div>
        <div class="hint" style="margin-bottom:7px;">联网时会自动抓取真实剧集封面。英文名作品已默认支持；想要中文剧名也显示真实海报，可填入免费的 TMDB API Key（<a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">点此免费申请</a>，复制 v3 key）。不填也能正常使用。</div>
        <input class="field" id="tmdbKey" placeholder="粘贴 TMDB API Key（v3 key，可留空）" value="${esc(DB.get('pref.tmdbKey', ''))}" style="margin-bottom:8px;">
        <button class="btn ghost block sm" id="saveKey">保存密钥</button>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.trash()}</span>清理数据</div>
        <button class="btn ghost block sm" id="cleanDiary">🗓 清除 N 个月前的日记</button>
        <button class="btn ghost block sm" id="cleanDeep" style="margin-top:7px;">🌍 清除 N 个月前的深度页面</button>
        <button class="btn danger block sm" id="wipe" style="margin-top:10px;">${Icons.trash()}清空全部数据</button>
        <div class="hint" style="margin-top:6px;">清空后无法恢复，请先备份。</div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.sun()}</span>外观皮肤</div>
        <div class="hint" style="margin-bottom:6px;">主题</div>
        <div class="chip-group" id="themeGroup">
          <span class="chip ${theme === '' ? 'on' : ''}" data-t="">🍊 三花米黄</span>
          <span class="chip ${theme === 'dark' ? 'on' : ''}" data-t="dark">🌙 深色</span>
          <span class="chip ${theme === 'matcha' ? 'on' : ''}" data-t="matcha">🍵 抹茶</span>
          <span class="chip ${theme === 'sakura' ? 'on' : ''}" data-t="sakura">🌸 樱花</span>
          <span class="chip ${theme === 'haze' ? 'on' : ''}" data-t="haze">🌫 雾霾蓝</span>
        </div>
        <div class="hint" style="margin:10px 0 6px;">布局</div>
        <div class="chip-group" id="layoutGroup">
          <span class="chip ${compact ? 'on' : ''}" data-c="0">标准</span>
          <span class="chip ${compact ? '' : 'on'}" data-c="1">紧凑</span>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.sun()}</span>显示</div>
        <div class="hint" style="margin-bottom:6px;">字号</div>
        <div class="chip-group" id="fontGroup">
          <span class="chip ${fs === 's' ? 'on' : ''}" data-fs="s">小</span>
          <span class="chip ${fs === 'm' ? 'on' : ''}" data-fs="m">标准</span>
          <span class="chip ${fs === 'l' ? 'on' : ''}" data-fs="l">大</span>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.cat()}</span>关于</div>
        <div class="about-line">
          <b>三花日常 · 毛茸茸生活手册</b><br>
          版本 v1.0 · 纯本地应用（PWA）<br>
          萌趣小动物风格的日常记录本：日程、记账、饮食睡眠、运动、穿搭、美妆、深度记录、影视文娱，一应俱全。<br>
          把你的一天，过成毛茸茸的样子 🐾
        </div>
      </div>`;

    $('#saveKey').onclick = () => {
      const k = $('#tmdbKey').value.trim();
      DB.set('pref.tmdbKey', k);
      toast(k ? '已保存，联网刷新即可显示真实海报' : '已清空密钥');
    };
    $('#bk').onclick = () => {
      if (window.electronAPI && window.electronAPI.exportFile) {
        window.electronAPI.exportFile(DB.all()).then(ok => { if (ok) toast('备份文件已导出'); });
      } else {
        download(`三花日常备份_${today()}.json`, JSON.stringify(DB.all()));
        toast('备份文件已导出');
      }
    };
    $('#im').onclick = () => {
      if (window.electronAPI && window.electronAPI.importFile) {
        window.electronAPI.importFile().then(async (obj) => {
          if (!obj) return;
          const ok = await confirmBox('导入将【合并】到现有数据（同名的键会被覆盖）。确定继续？', '合并导入');
          if (!ok) return;
          const n = await DB.importAll(obj, 'merge');
          toast(`已导入 ${n} 项数据`);
          render($('#pageRoot'));
        });
      } else { doImport(); }
    };
    if (window.electronAPI && window.electronAPI.isElectron) {
      const card = document.getElementById('cloudSyncCard');
      if (card) {
        card.style.display = '';
        window.electronAPI.getDataPath().then(p => {
          const h = document.getElementById('dataPathHint');
          if (h) h.innerHTML = '当前数据文件位置：<br><code style="word-break:break-all;">' + esc(p) + '</code>';
        });
        const btn = document.getElementById('moveCloud');
        if (btn) btn.onclick = async () => {
          const folder = await window.electronAPI.pickFolder();
          if (!folder) return;
          const np = await window.electronAPI.setDataPath(folder);
          toast('已移动到：' + np);
          render(root);
        };
      }
    }
    $('#cleanDiary').onclick = () => cleanOlder('diary');
    $('#cleanDeep').onclick = () => cleanOlder('deep');
    $('#wipe').onclick = doWipe;
    $$('#themeGroup .chip').forEach(c => c.onclick = () => {
      const t = c.dataset.t;
      DB.set('pref.theme', t);
      applyTheme(t);
      $$('#themeGroup .chip').forEach(x => x.classList.toggle('on', x === c));
      toast('主题已切换');
    });
    $$('#layoutGroup .chip').forEach(c => c.onclick = () => {
      const on = c.dataset.c === '1';
      DB.set('pref.compact', on);
      applyCompact(on);
      $$('#layoutGroup .chip').forEach(x => x.classList.toggle('on', x === c));
      toast('布局已调整');
    });
    $$('#fontGroup .chip').forEach(c => c.onclick = () => {
      const f = c.dataset.fs;
      DB.set('pref.fontsize', f);
      applyFont(f);
      $$('#fontGroup .chip').forEach(x => x.classList.toggle('on', x === c));
      toast('字号已调整');
    });
  }

  function doImport() {
    pickFile('application/json').then(async (res) => {
      if (!res) return;
      let obj;
      try { obj = JSON.parse(res.text); } catch (e) { toast('文件格式不对'); return; }
      if (!obj || typeof obj !== 'object') { toast('文件格式不对'); return; }
      const ok = await confirmBox('导入将【合并】到现有数据（同名的键会被覆盖）。确定继续？', '合并导入');
      if (!ok) return;
      const n = await DB.importAll(obj, 'merge');
      toast(`已导入 ${n} 项数据`);
      render($('#pageRoot'));
    });
  }

  function doWipe() {
    confirmBox('确定要清空全部数据吗？这一步无法恢复，建议先备份。', '确认清空').then(ok => {
      if (!ok) return;
      return confirmBox('最后再问一次：真的全部清空？', '全部清空');
    }).then(async ok => {
      if (!ok) return;
      await DB.importAll({}, 'replace');
      toast('已全部清空');
      render($('#pageRoot'));
    });
  }

  // kind: 'diary' 清 key 以 diary: 开头且日期早于此前的；'deep' 清 deep.pages 中 old 的页面
  function cleanOlder(kind) {
    UI.promptBox(kind === 'diary' ? '清除几个月前的日记？(填数字)' : '清除几个月前的深度页面？(填数字)', '6', '比如 6').then(async (v) => {
      const m = parseInt(v, 10);
      if (!m || m < 1) { toast('请输入大于 0 的数字'); return; }
      const cutoff = new Date(); cutoff.setMonth(cutoff.getMonth() - m);
      const cut = cutoff.getFullYear() + '-' + String(cutoff.getMonth() + 1).padStart(2, '0') + '-' + String(cutoff.getDate()).padStart(2, '0');
      let count = 0;
      if (kind === 'diary') {
        const keys = DB.keys().filter(k => k.startsWith('diary:'));
        for (const k of keys) {
          const d = k.slice(6);
          if (d < cut) { DB.del(k); count++; }
        }
      } else {
        const pages = DB.get('deep.pages', []);
        const keep = pages.filter(p => (p.updated || p.ts) >= new Date(cutoff).getTime());
        count = pages.length - keep.length;
        DB.set('deep.pages', keep);
      }
      DB.flushNow();
      toast(`已清理 ${count} 项`);
    });
  }

  window.Modules = window.Modules || {};
  window.Modules.settings = {
    id: 'settings', name: '设置', desc: '数据 · 备份 · 关于', icon: 'gear',
    render
  };
})();

</script>
<script>
/* ===== 应用主控制器：初始化、导航、路由 ===== */
(function () {
  let current = null;

  function list() {
    return Object.keys(window.Modules || {}).map(id => window.Modules[id]);
  }

  function buildNav() {
    const nav = UI.$('#navList');
    nav.innerHTML = list().map(m => `
      <button class="nav-item" data-id="${m.id}">
        <span class="ico">${Icons.get(m.icon) || ''}</span>
        <span class="lb">${esc(m.name)}</span>
      </button>`).join('');
    nav.onclick = (e) => {
      const it = e.target.closest('[data-id]');
      if (it) go(it.dataset.id);
    };
  }

  function applyFont(fs) {
    const r = document.documentElement;
    r.classList.remove('fs-s', 'fs-m', 'fs-l');
    r.classList.add('fs-' + (fs || 'm'));
  }

  function tickToday() {
    const d = new Date();
    UI.$('#todayChip').textContent = `${d.getMonth() + 1}月${d.getDate()}日 周${UI.WD[d.getDay()]}`;
  }

  function go(id) {
    const m = window.Modules[id];
    if (!m) return;
    if (current && window.Modules[current] && typeof window.Modules[current].onLeave === 'function') {
      try { window.Modules[current].onLeave(); } catch (e) { /* ignore */ }
    }
    UI.$$('#navList .nav-item').forEach(b => b.classList.toggle('active', b.dataset.id === id));
    UI.$('#topIco').innerHTML = Icons.get(m.icon) || '';
    UI.$('#topTitle').textContent = m.name;
    UI.$('#topDesc').textContent = m.desc || '';
    const sc = UI.$('#pageScroll');
    if (sc) sc.scrollTop = 0;
    current = id;
    const root = UI.$('#pageRoot');
    root.innerHTML = '';
    try { m.render(root); } catch (e) { root.innerHTML = `<div class="card">页面出错啦：${esc(e && e.message || e)}</div>`; }
  }

  const esc = (s) => UI.esc(s);

  async function boot() {
    // 装饰：启动页 + logo + 设置按钮
    UI.$('#splashCat').innerHTML = Icons.cat();
    UI.$('#navLogo').innerHTML = Icons.cat();
    UI.$('#settingsIco').innerHTML = Icons.gear();
    UI.$('#btnSettings').onclick = () => go('settings');

    // 关闭弹层的通用处理
    UI.$('#modalClose').onclick = () => UI.modal.close();

    try {
      await DB.init();
    } catch (e) { /* 即使数据库失败也要能打开 */ }

    // 字号偏好
    applyFont(DB.get('pref.fontsize', 'm'));
    // 主题皮肤 + 布局偏好
    const savedTheme = DB.get('pref.theme', '');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    if (DB.get('pref.compact', false)) document.documentElement.classList.add('compact');

    // 阻止移动端长按选中/菜单对内容区的影响（仅图片可长按）
    document.addEventListener('contextmenu', (e) => {
      if (e.target.tagName !== 'IMG' && e.target.tagName !== 'A') e.preventDefault();
    });

    buildNav();
    go('todo');

    setTimeout(() => UI.$('#splash').classList.add('hide'), 350);
    tickToday();

    // PWA：注册 Service Worker（仅 http/https 下生效，便于安卓“添加到主屏幕”）
    // 预览模式（URL 带 ?nosw 或 ?preview）不注册 SW，并清除旧缓存，保证每次都是最新代码
    const NO_SW = /[?&](nosw|preview)\b/.test(location.search);
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      if (NO_SW) {
        navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister().catch(()=>{})));
      } else {
        // v15：SW 脚本带版本号 + 禁用 HTTP 缓存，彻底破掉"旧 SW 循环喂旧文件"的死局
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js?v=16', { updateViaCache: 'none' })
            .then(reg => {
              // 已存在旧 SW 时，强制它立刻检查新版本
              reg.update().catch(()=>{});
              // 新 SW 安装后立刻接管，不等页面关闭
              reg.onupdatefound = () => {
                const nw = reg.installing;
                if (nw) nw.onstatechange = () => { if (nw.state === 'installed') nw.skipWaiting(); };
              };
            })
            .catch(() => {});
        });
      }
    }
  }

  window.App = { go, current: () => current };

  if (document.readyState !== 'loading') boot();
  else document.addEventListener('DOMContentLoaded', boot);
})();

</script>
</body>
</html>
