  function paint() { side === 'eat' ? renderEat($('#esPane')) : side === 'sleep' ? renderSleep($('#esPane')) : renderFav($('#esPane')); }

  /* ============ 能吃 ============ */
  function renderEat(p) {
    p.innerHTML = `
      <div class="card">
        <div class="card-title"><span class="ci">${Icons.pig()}</span>今日饮食推荐 <small>中国居民膳食指南</small></div>
        <div class="hint" style="margin-bottom:9px;">平衡膳食三原则：食物多样、谷类为主、餐餐有蔬菜天天有水果。每天最好吃够 12 种食物，每周 25 种以上 🐷</div>
        <div id="guideList"></div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.bowl()}</span>今天吃了啥 <small>${eatDate === today() ? '今天' : niceDate(eatDate)} · 一日一记</small></div>
        <div class="chip-group" id="catGrp" style="margin-bottom:8px;">
          ${CATS.map(c => `<button class="chip ${selCat === c ? 'on' : ''}" data-c="${c}">${c}</button>`).join('')}
        </div>
        <div class="chip-group" id="foodQuick" style="max-height:118px;overflow-y:auto;margin-bottom:9px;"></div>
        <div class="row">
          <input class="field grow" id="fName" placeholder="食物/饮品名称" list="foodList" maxlength="20">
          <input class="field" id="fQty" type="number" inputmode="decimal" placeholder="份量g/ml" style="width:104px;">
        </div>
        <datalist id="foodList">${FOODS.map(f => `<option value="${f[0]}"></option>`).join('')}</datalist>
        <div class="row" style="margin-top:8px;">
          <input class="field grow" id="fKcal" type="number" inputmode="decimal" placeholder="热量 kcal（自动估算，可改）">
          <button class="btn" id="fAdd">${Icons.plus()}加</button>
        </div>
        <div class="hint" style="margin-top:6px;">输入名称 + 份量后会自动算卡路里，找不到的食物可以手填热量～</div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.star()}</span>今日汇总 <small id="kcalSum"></small></div>
        <div id="catBar"></div>
        <div id="eatList" style="margin-top:9px;"></div>
        <div class="row" style="margin-top:10px;">
          <button class="btn ghost grow" id="eatHistory">查看历史记录</button>
        </div>
      </div>`;

    drawGuide(); drawQuick(); drawEatList();
    $$('#catGrp .chip').forEach(c => c.onclick = () => {
      selCat = c.dataset.c;
      $$('#catGrp .chip').forEach(x => x.classList.toggle('on', x === c));
      drawQuick();
    });
    $('#fName').oninput = autoKcal;
    $('#fQty').oninput = autoKcal;
    $('#fAdd').onclick = addFood;
    $('#eatHistory').onclick = eatHistory;
  }

  function autoKcal() {
    const n = $('#fName').value.trim();
    const q = parseFloat($('#fQty').value);
    const f = FOOD_MAP[n];
    if (f && q > 0) $('#fKcal').value = Math.round(f[2] * q / 100);
  }

  function drawQuick() {
    const list = FOODS.filter(f => f[3] === selCat);
    $('#foodQuick').innerHTML = list.map(f =>
      `<button class="chip sm" data-n="${esc(f[0])}">${f[1]} ${esc(f[0])}</button>`).join('');
    $$('#foodQuick .chip').forEach(c => c.onclick = () => {
      $('#fName').value = c.dataset.n;
      if (!$('#fQty').value) $('#fQty').value = selCat === '饮品' ? 250 : 100;
      autoKcal();
      $('#fQty').focus();
    });
  }

  function drawGuide() {
    const day = getEat()[eatDate] || { items: [] };
    const sum = {};
    day.items.forEach(i => { sum[i.cat] = (sum[i.cat] || 0) + Number(i.qty || 0); });
    const TARGET = { 谷薯: 350, 蔬菜: 400, 水果: 275, 肉蛋: 175, 奶豆: 350, 饮品: 1600 };
    $('#guideList').innerHTML = GUIDE.map(([cat, name, txt]) => {
      const got = sum[cat] || 0, tgt = TARGET[cat];
      const pct = Math.min(100, Math.round(got / tgt * 100));
      return `<div style="margin-bottom:9px;">
        <div class="row" style="justify-content:space-between;">
          <b style="font-size:12.5px;">${name}</b>
          <span class="hint">${got}/${tgt}${cat === '饮品' ? 'ml' : 'g'} · ${pct}%</span>
        </div>
        <div class="hint" style="margin:2px 0 4px;">${txt}</div>
        <div class="nutri-bar"><i style="width:${pct}%;background:${CAT_COLOR[cat]}"></i></div>
      </div>`;
    }).join('');
  }

  function addFood() {
    const n = $('#fName').value.trim();
    if (!n) { toast('先写食物名字呀 🍚'); return; }
    const q = parseFloat($('#fQty').value) || 0;
    let k = parseFloat($('#fKcal').value);
    const f = FOOD_MAP[n];
    if (isNaN(k)) k = f && q ? Math.round(f[2] * q / 100) : 0;
    const all = getEat();
    const day = all[eatDate] || { items: [], ts: Date.now() };
    day.items.push({ id: uid(), name: n, ico: f ? f[1] : (selCat === '饮品' ? '🥤' : '🍽'), kcal: Math.round(k), qty: q, cat: f ? f[3] : selCat, time: UI.nowHM() });
    day.ts = Date.now();
    all[eatDate] = day; setEat(all);
    $('#fName').value = ''; $('#fQty').value = ''; $('#fKcal').value = '';
    drawEatList(); drawGuide();
    toast(`记下 ${n} ${k ? k + ' kcal' : ''}`);
  }

  function drawEatList() {
    const day = getEat()[eatDate] || { items: [] };
    const total = day.items.reduce((a, b) => a + Number(b.kcal || 0), 0);
    $('#kcalSum').textContent = day.items.length ? `共 ${day.items.length} 项 · ${total} kcal` : '';
    const sum = {};
    day.items.forEach(i => { sum[i.cat] = (sum[i.cat] || 0) + Number(i.kcal || 0); });
    const ent = Object.entries(sum).filter(x => x[1] > 0);
    $('#catBar').innerHTML = ent.length ? `
      <div class="nutri-bar">${ent.map(([c, v]) => `<i style="flex:${v};background:${CAT_COLOR[c] || '#ccc'}"></i>`).join('')}</div>
      <div class="chip-group" style="margin-top:6px;">${ent.map(([c, v]) => `<span class="chip sm"><i style="width:8px;height:8px;border-radius:50%;background:${CAT_COLOR[c]};display:inline-block;"></i>${c} ${v}kcal</span>`).join('')}</div>` : '';
    const box = $('#eatList');
    if (!day.items.length) {
      box.innerHTML = `<div class="empty"><div class="e-ico">${Icons.bowl()}</div>今天还没记录～<br>吃点好的再回来记吧</div>`;
      return;
    }
    box.innerHTML = day.items.map(i => `
      <div class="food-item" data-id="${i.id}">
        <div class="food-ico">${i.ico}</div>
        <div class="grow">
          <div style="font-size:13px;font-weight:700;">${esc(i.name)} ${i.qty ? `<span class="hint">${i.qty}${i.cat === '饮品' ? 'ml' : 'g'}</span>` : ''}</div>
          <div class="hint">${i.time || ''} · ${esc(i.cat)}</div>
        </div>
        <b style="font-size:13.5px;color:var(--orange-d);">${i.kcal} kcal</b>
        <span class="todo-del" data-act="del">×</span>
      </div>`).join('');
    box.onclick = (e) => {
      if (e.target.dataset.act !== 'del') return;
      const it = e.target.closest('.food-item');
      const all = getEat(); const d = all[eatDate];
      d.items = d.items.filter(x => x.id !== it.dataset.id);
      all[eatDate] = d; setEat(all); drawEatList(); drawGuide();
    };
  }

  function eatHistory() {
    const all = getEat();
    const ds = Object.keys(all).filter(d => (all[d].items || []).length).sort().reverse();
    if (!ds.length) { toast('还没有历史记录'); return; }
    modal.open('饮食历史（一日一记）', `<div id="ehList">${ds.map(d => {
      const it = all[d].items || [];
      const k = it.reduce((a, b) => a + Number(b.kcal || 0), 0);
      return `<div class="rec-item" data-d="${d}">
        <div class="rec-ico">${it[0] ? it[0].ico : '🍽'}</div>
        <div class="rec-main"><div class="t">${d} 星期${UI.wdOf(d)}</div>
        <div class="s">${it.slice(0, 6).map(x => x.ico + x.name).join('、')}${it.length > 6 ? '…' : ''}</div></div>
        <b style="font-size:12.5px;color:var(--orange-d);white-space:nowrap;">${k}kcal</b>
      </div>`;
    }).join('')}</div>`, (b) => {
      $$('#ehList .rec-item', b).forEach(it => it.onclick = () => {
        eatDate = it.dataset.d; modal.close(); renderEat($('#esPane'));
      });
    });
  }

  /* ============ 能睡 ============ */
  function renderSleep(p) {
    const sl = getSleep();
    const t = today();
    const cur = sl[t] || {};
    p.innerHTML = `
      <div class="card">
        <div class="card-title"><span class="ci">${Icons.moon()}</span>早睡的好处 <small>说给赖床的你听</small></div>
        <ul class="bullet">
          <li>23 点前入睡，生长激素分泌高峰在 22:00-02:00，是皮肤修复的黄金时段。</li>
          <li>规律作息让皮质醇（压力激素）回落，第二天情绪更稳定、不易暴躁。</li>
          <li>深睡时大脑淋巴系统清理代谢废物，记忆力和专注力都靠它。</li>
          <li>睡够 7-8 小时的人食欲激素更平衡，比熬夜的人更不容易发胖。</li>
          <li>免疫细胞在夜间活跃，早睡的人感冒频率明显更低。</li>
          <li>眼周血液循环改善，黑眼圈和浮肿会肉眼可见地变淡。</li>
        </ul>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.rabbit()}</span>打卡：你今天美容觉了吗？</div>
        <div class="row" style="align-items:center;gap:12px;">
          <div class="grow">
            <span class="lbl">入睡时间</span>
            <input class="field" id="bedT" type="time" value="${cur.bed || '23:00'}">
            <span class="lbl" style="margin-top:8px;">起床时间</span>
            <input class="field" id="upT" type="time" value="${cur.up || '07:00'}">
            <div class="hint" style="margin-top:7px;" id="durHint"></div>
          </div>
          <div style="text-align:center;">
            <div class="stamp-btn ${cur.stamp ? 'done' : ''}" id="stampBtn">美</div>
            <div class="hint" style="margin-top:5px;width:66px;">${cur.stamp ? '已盖章' : '点我盖章'}</div>
          </div>
        </div>
        <button class="btn block" id="saveSleep" style="margin-top:11px;">保存今天的睡眠</button>
      </div>

      <div class="card">
        <div class="stat-row" style="margin-bottom:11px;">
          <div class="stat"><div class="v" id="avgDur">-</div><div class="k">本月平均时长</div></div>
          <div class="stat"><div class="v" id="stampCnt">-</div><div class="k">本月盖章天数</div></div>
          <div class="stat"><div class="v" id="earlyCnt">-</div><div class="k">23点前入睡</div></div>
        </div>
        <div class="cal-head">
          <button class="cal-nav" id="spm">‹</button>
          <div class="m" id="sCalTitle"></div>
          <button class="cal-nav" id="snm">›</button>
        </div>
        <div class="cal-grid" id="sCalGrid"></div>
        <div class="hint" style="margin-top:8px;text-align:center;">格子下方数字为当天睡眠时长（小时）· 红章代表美容觉达标</div>
      </div>`;

    const calcDur = () => {
      const b = $('#bedT').value, u = $('#upT').value;
      if (!b || !u) return null;
      const [bh, bm] = b.split(':').map(Number), [uh, um] = u.split(':').map(Number);
      let d = (uh * 60 + um) - (bh * 60 + bm);
      if (d <= 0) d += 1440;
      return d / 60;
    };
    const showDur = () => {
      const d = calcDur();
      $('#durHint').textContent = d == null ? '' : `睡眠时长约 ${d.toFixed(1)} 小时` + (d >= 7 && d <= 9 ? '，很棒！' : d < 7 ? '，有点不够哦' : '，睡得挺足');
    };
    $('#bedT').oninput = showDur; $('#upT').oninput = showDur; showDur();

    $('#saveSleep').onclick = () => {
      const all = getSleep();
      const c = all[t] || {};
      c.bed = $('#bedT').value; c.up = $('#upT').value; c.dur = calcDur();
      all[t] = c; setSleep(all);
      drawSleepCal(); toast('睡眠记录保存啦 🌙');
    };
    $('#stampBtn').onclick = () => {
      const all = getSleep();
      const c = all[t] || {};
      c.stamp = !c.stamp;
      if (!c.bed) { c.bed = $('#bedT').value; c.up = $('#upT').value; c.dur = calcDur(); }
      all[t] = c; setSleep(all);
      $('#stampBtn').classList.toggle('done', !!c.stamp);
      $('#stampBtn').nextElementSibling.textContent = c.stamp ? '已盖章' : '点我盖章';
      drawSleepCal();
      toast(c.stamp ? '「美」章盖好啦 💮' : '章撤销了');
    };
    $('#spm').onclick = () => { calM--; if (calM < 0) { calM = 11; calY--; } drawSleepCal(); };
    $('#snm').onclick = () => { calM++; if (calM > 11) { calM = 0; calY++; } drawSleepCal(); };
    drawSleepCal();
  }

  function drawSleepCal() {
    $('#sCalTitle').textContent = `${calY} 年 ${calM + 1} 月`;
    const sl = getSleep();
    const cells = monthMatrix(calY, calM);
    const t = today();
    let html = WD.map(w => `<div class="cal-w">${w}</div>`).join('');
    let durs = [], stamps = 0, early = 0;
    cells.forEach(d => {
      if (!d) { html += `<div class="cal-d blank"></div>`; return; }
      const s = sl[d];
      if (s) {
        if (s.dur != null) durs.push(s.dur);
        if (s.stamp) stamps++;
        if (s.bed) { const h = Number(s.bed.split(':')[0]); if (h >= 20 && h < 23) early++; }
      }
      html += `<div class="cal-d ${d === t ? 'today' : ''}" data-d="${d}" style="justify-content:flex-start;padding-top:5px;">
        ${parseYMD(d).getDate()}
        ${s && s.dur != null ? `<span class="mini" style="color:${s.dur >= 7 ? '#5F8F49' : '#D2604E'}">${s.dur.toFixed(1)}h</span>` : ''}
        ${s && s.stamp ? `<span class="stamp-mark" style="position:absolute;right:2px;top:2px;transform:rotate(-14deg) scale(.78);">美</span>` : ''}
      </div>`;
    });
    $('#sCalGrid').innerHTML = html;
    $('#avgDur').textContent = durs.length ? (durs.reduce((a, b) => a + b, 0) / durs.length).toFixed(1) + 'h' : '-';
    $('#stampCnt').textContent = stamps + ' 天';
    $('#earlyCnt').textContent = early + ' 天';
    $$('#sCalGrid .cal-d[data-d]').forEach(c => c.onclick = () => editSleepDay(c.dataset.d));
  }

  function editSleepDay(d) {
    const all = getSleep(); const s = all[d] || {};
    modal.open(d + ' 的睡眠', `
      <span class="lbl">入睡时间</span><input class="field" id="sB" type="time" value="${s.bed || '23:00'}">
      <span class="lbl" style="margin-top:8px;">起床时间</span><input class="field" id="sU" type="time" value="${s.up || '07:00'}">
      <div class="row" style="margin-top:10px;align-items:center;">
        <button class="chip ${s.stamp ? 'on' : ''}" id="sStamp">💮 美容觉盖章</button>
        <span class="hint grow" id="sDur"></span>
      </div>
      <div class="row" style="margin-top:12px;">
        <button class="btn ghost grow" id="sDel">清除这天</button>
        <button class="btn grow" id="sSave">保存</button>
      </div>`, (b) => {
      let stamp = !!s.stamp;
      const calc = () => {
        const [bh, bm] = $('#sB', b).value.split(':').map(Number);
        const [uh, um] = $('#sU', b).value.split(':').map(Number);
        let x = (uh * 60 + um) - (bh * 60 + bm); if (x <= 0) x += 1440;
        $('#sDur', b).textContent = `约 ${(x / 60).toFixed(1)} 小时`;
        return x / 60;
      };
      calc();
      $('#sB', b).oninput = calc; $('#sU', b).oninput = calc;
      $('#sStamp', b).onclick = () => { stamp = !stamp; $('#sStamp', b).classList.toggle('on', stamp); };
      $('#sSave', b).onclick = () => {
        all[d] = { bed: $('#sB', b).value, up: $('#sU', b).value, dur: calc(), stamp };
        setSleep(all); modal.close(); drawSleepCal(); toast('保存好啦');
      };
      $('#sDel', b).onclick = async () => {
        if (await confirmBox(`清除 ${d} 的睡眠记录？`)) { delete all[d]; setSleep(all); modal.close(); drawSleepCal(); toast('已清除'); }
      };
    });
  }

  /* ============ 爱吃爱喝（收藏夹） ============ */

    { t: '食补·银耳百合', b: '银耳润肺、百合安神，秋燥咽干、睡不安的人炖一碗，皮肤也水润。' },

    { t: '养生茶·山楂麦芽', b: '吃撑了来一杯山楂麦芽水，消食化积，比健胃消食片温和。' },
    { t: '梳头百下醒脑', b: '用木梳从前往后梳 100 下，疏通头部经络，头痛昏沉都减轻。' },
    { t: '腹式呼吸安神', b: '吸气鼓腹、呼气收腹，每天 5 分钟，副交感神经激活，焦虑睡不好的人必学。' }
  ];

  /* ---------------- 状态与工具 ---------------- */
  let tab = 'sum';
  let selPosture = 'p1';
  let calY = new Date().getFullYear(), calM = new Date().getMonth();

  const getLogs = () => DB.get('sport.logs', {});
  const setLogs = (v) => DB.set('sport.logs', v);
  const getDone = () => DB.get('sport.done', { gym: {}, posture: {}, health: {} });
  const setDone = (v) => DB.set('sport.done', v);

  function toggleDone(type, key) {
    const d = getDone(); d[type] = d[type] || {};
    const arr = d[type][today()] || [];
    const i = arr.indexOf(key);
    if (i >= 0) arr.splice(i, 1); else arr.push(key);
    d[type][today()] = arr; setDone(d);
  }
  function isDone(type, key) { const d = getDone(); return (d[type] && d[type][today()] || []).indexOf(key) >= 0; }
  function weekNo() { const d = new Date(); const j = new Date(d.getFullYear(), 0, 1); return Math.floor((d - j) / 604800000); }
  function gymTplIdx() { const o = DB.get('sport.gymTpl', null); return o != null ? o : weekNo() % GYM_TEMPLATES.length; }
  function weekDates() {
    const d = new Date(); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd);
    const out = []; for (let i = 0; i < 7; i++) { out.push(ymd(d)); d.setDate(d.getDate() + 1); } return out;
  }
  function dayOfYear() { const d = new Date(); const j = new Date(d.getFullYear(), 0, 0); return Math.floor((d - j) / 86400000); }

  function render(root) {
    tab = DB.get('sport.tab', 'sum');
    root.innerHTML = `
      <div class="tabs sub" id="spTabs" style="margin-bottom:12px;">
        <div class="tab ${tab === 'sum' ? 'active' : ''}" data-t="sum">🏃 汇总打卡</div>
        <div class="tab ${tab === 'pos' ? 'active' : ''}" data-t="pos">🧍 体态矫正</div>
        <div class="tab ${tab === 'gym' ? 'active' : ''}" data-t="gym">💪 增肌塑形</div>
        <div class="tab ${tab === 'health' ? 'active' : ''}" data-t="health">🧘 长寿养生</div>
      </div>
      <div id="spPane"></div>`;
    $$('#spTabs .tab').forEach(el => el.onclick = () => {
      tab = el.dataset.t; DB.set('sport.tab', tab);
      $$('#spTabs .tab').forEach(x => x.classList.toggle('active', x === el));
      paint();
    });
    paint();
  }
  function paint() {
    const p = $('#spPane');
    if (tab === 'sum') renderSum(p);
    else if (tab === 'pos') renderPosture(p);
    else if (tab === 'gym') renderGym(p);
    else renderHealth(p);
  }
  function refreshSumIfOpen() { if (tab === 'sum') { const p = $('#spPane'); if (p) renderSum(p); } }

  /* ============ 汇总打卡 ============ */
  function renderSum(p) {
    const t = today();
    p.innerHTML = `
      <div class="card">
        <div class="card-title"><span class="ci">${Icons.dumbbell()}</span>今天动了吗 <small>${t} 星期${wdOf(t)}</small></div>
        <div class="chip-group" id="quickSport" style="margin-bottom:9px;">
          ${['跑步', '快走', '骑行', '游泳', '力量训练', '瑜伽', '拉伸', '八段锦', '五禽戏', '跳绳', '羽毛球', '爬山', '通勤步行', '打扫卫生'].map(s => `<button class="chip sm" data-s="${s}">${s}</button>`).join('')}
        </div>
        <div class="row">
          <input class="field grow" id="spName" placeholder="今天做了什么运动">
          <input class="field" id="spMin" type="number" inputmode="numeric" placeholder="分钟" style="width:84px;">
        </div>
        <input class="field" id="spNote" placeholder="感受 / 组数备注（可选）" style="margin-top:8px;">
        <button class="btn block" id="spAdd" style="margin-top:10px;">${Icons.plus()}打卡</button>
      </div>

      <div class="card">
        <div class="stat-row">
          <div class="stat"><div class="v" id="stDays">0</div><div class="k">本月打卡天数</div></div>
          <div class="stat"><div class="v" id="stMins">0</div><div class="k">本月总分钟</div></div>
          <div class="stat"><div class="v" id="stStreak">0</div><div class="k">连续天数</div></div>
        </div>
      </div>

      <div class="card" id="sumProg">
        <div class="card-title"><span class="ci">${Icons.star()}</span>本周计划完成情况 <small>在各板块勾选自动同步</small></div>
        <div id="progBody"></div>
      </div>

      <div class="card tip-card">
        <div class="tip-ico">${HEALTH_TIPS[dayOfYear() % HEALTH_TIPS.length].ico || '🌿'}</div>
        <div class="grow">
          <div class="tip-t">今日养生 · ${HEALTH_TIPS[dayOfYear() % HEALTH_TIPS.length].t}</div>
          <div class="tip-b">${HEALTH_TIPS[dayOfYear() % HEALTH_TIPS.length].b}</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.star()}</span>今日记录</div>
        <div id="spToday"></div>
      </div>

      <div class="card">
        <div class="cal-head">
          <button class="cal-nav" id="cpm">‹</button><div class="m" id="spCalT"></div><button class="cal-nav" id="cnm">›</button>
        </div>
        <div class="cal-grid" id="spCal"></div>
        <div class="hint" style="text-align:center;margin-top:7px;">有打卡的日子会亮起小爪印 🐾 点击查看当天记录</div>
      </div>`;

    drawProg();
    $$('#quickSport .chip').forEach(c => c.onclick = () => { $('#spName').value = c.dataset.s; $('#spMin').focus(); });
    $('#spAdd').onclick = () => {
      const n = $('#spName').value.trim();
      if (!n) { toast('写一下做了什么运动'); return; }
      const all = getLogs();
      const arr = all[t] || [];
      arr.push({ id: uid(), name: n, mins: Number($('#spMin').value) || 0, note: $('#spNote').value.trim(), time: nowHM() });
      all[t] = arr; setLogs(all);
      $('#spName').value = ''; $('#spMin').value = ''; $('#spNote').value = '';
      drawSumToday(); drawSpCal(); toast('打卡成功，你真棒！💪');
    };
    $('#cpm').onclick = () => { calM--; if (calM < 0) { calM = 11; calY--; } drawSpCal(); };
    $('#cnm').onclick = () => { calM++; if (calM > 11) { calM = 0; calY++; } drawSpCal(); };
    drawSumToday(); drawSpCal();
  }

  function drawProg() {
    const wd = weekDates(); const gi = gymTplIdx();
    const gymTotal = GYM_TEMPLATES[gi].length * 3;
    const posTotal = DB.get('sport.posture', DEF_POSTURE).length;
    const hTotal = 7 * 3;
    let g = 0, ps = 0, h = 0;
    wd.forEach(d => {
      (getDone().gym[d] || []).forEach(k => { if (k.indexOf('g' + gi + '_') === 0) g++; });
      (getDone().posture[d] || []).forEach(() => { ps++; });
      (getDone().health[d] || []).forEach(k => { if (k.indexOf('h_') === 0) h++; });
    });
    const rows = [
      ['💪 增肌塑形', g, gymTotal],
      ['🧍 体态矫正', ps, posTotal],
      ['🧘 长寿养生', h, hTotal]
    ];
    $('#progBody').innerHTML = rows.map(([nm, v, tot]) => {
      const pct = tot ? Math.min(100, Math.round(v / tot * 100)) : 0;
      return `<div class="prog-row"><span class="nm">${nm}</span>
        <div class="pbar"><i style="width:${pct}%"></i></div>
        <span class="pv">${v}/${tot}</span></div>`;
    }).join('');
  }

  function drawSumToday() {
    const t = today();
    const arr = getLogs()[t] || [];
    const box = $('#spToday');
    if (!arr.length) box.innerHTML = `<div class="empty"><div class="e-ico">${Icons.rabbit()}</div>今天还没动～<br>哪怕散步 10 分钟也算数！</div>`;
    else box.innerHTML = arr.map(x => `
      <div class="food-item" data-id="${x.id}">
        <div class="food-ico">🏃</div>
        <div class="grow"><div style="font-size:13px;font-weight:700;">${esc(x.name)}${x.mins ? ` · ${x.mins} 分钟` : ''}</div>
        <div class="hint">${x.time || ''}${x.note ? ' · ' + esc(x.note) : ''}</div></div>
        <span class="todo-del" data-act="del">×</span>
      </div>`).join('');
    box.onclick = (e) => {
      if (e.target.dataset.act !== 'del') return;
      const id = e.target.closest('.food-item').dataset.id;
      const all = getLogs(); all[t] = (all[t] || []).filter(x => x.id !== id);
      if (!all[t].length) delete all[t];
      setLogs(all); drawSumToday(); drawSpCal();
    };
  }

  function drawSpCal() {
    $('#spCalT').textContent = `${calY} 年 ${calM + 1} 月`;
    const logs = getLogs();
    const cells = monthMatrix(calY, calM);
    const t = today();
    let days = 0, mins = 0;
    let html = WD.map(w => `<div class="cal-w">${w}</div>`).join('');
    cells.forEach(d => {
      if (!d) { html += `<div class="cal-d blank"></div>`; return; }
      const arr = logs[d];
      if (arr && arr.length) { days++; mins += arr.reduce((a, b) => a + Number(b.mins || 0), 0); }
      html += `<div class="cal-d ${d === t ? 'today' : ''}" data-d="${d}">
        ${parseYMD(d).getDate()}${arr && arr.length ? `<span class="mini">🐾${arr.reduce((a, b) => a + Number(b.mins || 0), 0) || ''}</span>` : ''}</div>`;
    });
    $('#spCal').innerHTML = html;
    $('#stDays').textContent = days; $('#stMins').textContent = mins;
    let streak = 0; const d = new Date();
    for (; ;) {
      const k = ymd(d);
      if (logs[k] && logs[k].length) { streak++; d.setDate(d.getDate() - 1); }
      else break;
      if (streak > 999) break;
    }
    $('#stStreak').textContent = streak;
    $$('#spCal .cal-d[data-d]').forEach(c => c.onclick = () => {
      const arr = logs[c.dataset.d] || [];
      modal.open(c.dataset.d + ' 的运动', arr.length
        ? arr.map(x => `<div class="rec-item"><div class="rec-ico">🏃</div><div class="rec-main"><div class="t">${esc(x.name)}${x.mins ? ' · ' + x.mins + '分钟' : ''}</div><div class="s">${esc(x.note || '')}</div></div></div>`).join('')
        : `<div class="empty"><div class="e-ico">${Icons.empty()}</div>这天没有记录</div>`);
    });
  }

  /* ============ 体态矫正 ============ */

    let list = DB.get('sport.posture', null);
    if (!list) { list = DEF_POSTURE; DB.set('sport.posture', list); }
    const cur = list.find(x => x.id === selPosture) || list[0];
    selPosture = cur ? cur.id : null;
    const donePosture = getDone().posture[today()] || [];
    p.innerHTML = `
      <div class="card">
        <div class="card-title"><span class="ci">${Icons.sheep()}</span>今日体态打卡 <small>勾选今天练过的</small></div>
        <div id="posTicks"></div>

      <div class="card">

            <div class="row" style="margin-top:8px;">

        <ul class="bullet">
          <li>体态矫正 = 放松紧张肌 + 激活无力肌 + 重建日常习惯，三步缺一不可。</li>

    $('#posTicks').innerHTML = list.map(x => `

        <span class="wp-txt">${esc(x.problem)}</span>
        <span class="tick ${donePosture.includes(x.id) ? 'on' : ''}" data-key="p_${x.id}"></span>
      </label>`).join('');
    $$('#posTicks .tick').forEach(el => el.onclick = (e) => {
      e.preventDefault();
      toggleDone('posture', el.dataset.key);
      const on = isDone('posture', el.dataset.key);
      el.classList.toggle('on', on);
      el.closest('.wp-item').classList.toggle('wp-done', on);
      drawProg();
    });

    const drawList = () => {
      const l = DB.get('sport.posture', []);
      $('#posList').innerHTML = l.map(x => `
        <div class="chip ${x.id === selPosture ? 'on' : ''}" data-id="${x.id}"
          style="display:block;width:100%;text-align:left;margin-bottom:5px;padding:8px 8px;line-height:1.35;">${esc(x.problem)}</div>`).join('');
      $$('#posList .chip').forEach(c => c.onclick = () => { selPosture = c.dataset.id; renderPosture(p); });

    $('#posSave').onclick = () => {
      const l = DB.get('sport.posture', []);
      const i = l.findIndex(x => x.id === selPosture);
      if (i < 0) return;
      l[i].problem = $('#posName').value.trim() || l[i].problem;
      l[i].plan = $('#posPlan').value;
      DB.set('sport.posture', l); renderPosture(p); toast('方案已保存');
    };
    $('#posDel').onclick = async () => {
      if (!(await confirmBox('删除这个体态问题及方案？'))) return;
      const l = DB.get('sport.posture', []).filter(x => x.id !== selPosture);
      DB.set('sport.posture', l); selPosture = l[0] ? l[0].id : null; renderPosture(p); toast('已删除');
    };
    $('#posAdd').onclick = () => {
      const l = DB.get('sport.posture', []);
      const id = uid();
      l.push({ id, problem: '新的体态问题', plan: '' });
      DB.set('sport.posture', l); selPosture = id; renderPosture(p);
    };
  }

  /* ============ 增肌塑形 ============ */

      renderGym(p); toast('已换一套本周排班');

    const ti = todayIdx();
