    p.innerHTML = `
      <div class="card">
        <div class="card-title"><span class="ci">${Icons.panda()}</span>一周养生排班 <small>每天 a/b/c，点圆圈打卡</small></div>
        <div id="hpList"></div>
        <div class="hint" style="margin-top:6px;">排班原则：八段锦 + 五禽戏 + 拍八虚 打底，穿插泡脚 / 艾灸 / 刮肝经。打卡会同步到汇总「本周计划完成情况」。</div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.book()}</span>知识讲堂 <small>养生方法库 · 可加链接</small>
          <button class="btn ghost sm" id="kAdd" style="float:right;margin-top:-2px;">${Icons.plus()}新增</button></div>
        <div id="libBox"></div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.heart()}</span>日常养生小事</div>
        <ul class="bullet">
          <li>晨起一杯温水，睡前 40℃ 泡脚 15 分钟。</li>
          <li>子时（23:00 前）入睡，午时小憩 20 分钟。</li>
          <li>饭吃七分饱，细嚼 20 下再咽。</li>
          <li>每天梳头 100 下、揉腹 5 分钟、搓耳 1 分钟。</li>
          <li>情志养生：怒伤肝、思伤脾，遇事先深呼吸六次。</li>
        </ul>
      </div>`;

    const drawPlan = () => {
      const pl = DB.get('sport.healthPlan', []);
      const dn = getDone().health[today()] || [];
      $('#hpList').innerHTML = pl.map((x, i) => `
        <div class="plan-day ${i === ti ? 'today' : ''}">
          <div class="pd">${DAYS[i].replace('周', '')}</div>
          <div class="grow">
            ${x.items.map((it, si) => { const key = 'h_' + i + '_' + si; const on = dn.indexOf(key) >= 0; return `
              <label class="wp-item ${on ? 'wp-done' : ''}">
                <span class="wp-key">${'abc'[si]}</span>
                <span class="wp-txt">${esc(it)}</span>
                <span class="tick ${on ? 'on' : ''}" data-key="${key}"></span>
              </label>`; }).join('')}
          </div>
        </div>`).join('');
      $$('#hpList .tick').forEach(el => el.onclick = (e) => {
        e.preventDefault();
        toggleDone('health', el.dataset.key);
        const on = isDone('health', el.dataset.key);
        el.classList.toggle('on', on);
        el.closest('.wp-item').classList.toggle('wp-done', on);
        drawProg();
      });
      $$('#hpList .plan-day .grow').forEach((g, i) => g.ondblclick = () => editHealth(i));
    };
    drawPlan();

    function editHealth(i) {
      const pl = DB.get('sport.healthPlan', []);
      modal.open(DAYS[i] + ' 养生安排', `
        <span class="lbl">每行一项（a/b/c）</span>
        <textarea class="field" id="hpTxt" style="min-height:130px;">${esc(pl[i].items.join('\n'))}</textarea>
        <button class="btn block" id="hpSave" style="margin-top:12px;">保存</button>`, (b) => {
        $('#hpSave', b).onclick = () => {
          pl[i].items = $('#hpTxt', b).value.split('\n').map(x => x.trim()).filter(Boolean);
          DB.set('sport.healthPlan', pl); modal.close(); drawPlan(); toast('已保存');
        };
      });
    }

    /* 知识讲堂 */
    const userLib = DB.get('sport.knowledge', []);
    const allLib = Object.assign({}, HEALTH_LIB, {});
    let libHtml = Object.keys(HEALTH_LIB).map(k => libCard(HEALTH_LIB[k])).join('');
    if (userLib.length) libHtml += userLib.map(k => libCard(k, true)).join('');
    $('#libBox').innerHTML = libHtml;
    $$('#libBox .acc').forEach(a => a.querySelector('.acc-h').onclick = () => a.classList.toggle('open'));
    $$('#libBox .klink').forEach(b => b.onclick = () => {
      const u = b.dataset.u; if (u) window.open(u, '_blank', 'noopener');
    });
    $$('#libBox .kdel').forEach(b => b.onclick = async () => {
      if (!(await confirmBox('删除这个养生方法？'))) return;
      const arr = DB.get('sport.knowledge', []).filter(x => x.id !== b.dataset.id);
      DB.set('sport.knowledge', arr); renderHealth(p); toast('已删除');
    });

    function libCard(L, isUser) {
      return `<div class="acc" data-k="${isUser ? L.id : L.name}">
        <div class="acc-h">${L.ico || '🌿'} ${esc(L.name)}
          ${L.link ? `<span class="klink" data-u="${esc(L.link)}">打开链接 ↗</span>` : ''}
          ${isUser ? `<span class="kdel" data-id="${L.id}">删除</span>` : ''}
          <span class="ar">▾</span></div>
        <div class="acc-b">${esc(L.intro || '')}
${L.items ? L.items.map(([n, d]) => `\n▸ <b>${esc(n)}</b>\n${esc(d)}`).join('\n') : ''}
${L.tips ? '\n\n💡 ' + esc(L.tips) : ''}</div>
      </div>`;
    }

    $('#kAdd').onclick = () => {
      modal.open('新增养生方法', `
        <span class="lbl">名称</span>
        <input class="field" id="nkName" placeholder="如：拍打胆经">
        <span class="lbl" style="margin-top:8px;">说明（可选）</span>
        <textarea class="field" id="nkIntro" style="min-height:80px;" placeholder="一句话介绍做法与好处"></textarea>
        <span class="lbl" style="margin-top:8px;">链接（可选，可跳转到文章/视频）</span>
        <input class="field" id="nkLink" placeholder="https://...">
        <button class="btn block" id="nkSave" style="margin-top:12px;">保存</button>`, (b) => {
        $('#nkSave', b).onclick = () => {
          const name = $('#nkName', b).value.trim();
          if (!name) { toast('写个名称吧'); return; }
          const arr = DB.get('sport.knowledge', []);
          arr.push({ id: uid(), name, ico: '🌟', intro: $('#nkIntro', b).value.trim(), items: [], tips: '', link: $('#nkLink', b).value.trim() });
          DB.set('sport.knowledge', arr); modal.close(); renderHealth(p); toast('已添加，可点链接跳转');
        };
      });
    };
  }

  window.Modules = window.Modules || {};
  window.Modules.sport = { id: 'sport', name: '运动养生', desc: '兔兔陪你蹦跶起来', icon: 'rabbit', render };
})();

</script>
<script>
/* ===== 模块 5：穿搭表达 ===== */
(function () {
  const { $, $$, esc, uid, today, toast, modal, confirmBox, pickImage } = UI;

  const SECTIONS = [
    { k: 'clothes', n: '衣服篇', ico: '👗' },
    { k: 'acc', n: '饰品篇', ico: '💍' },
    { k: 'hair', n: '发型篇', ico: '💇' },
    { k: 'practice', n: '灵活实践', ico: '📸' }
  ];

  const WEATHER_CODE = {
    0: ['☀️', '晴'], 1: ['🌤', '大部晴'], 2: ['⛅', '多云'], 3: ['☁️', '阴'],
    45: ['🌫', '雾'], 48: ['🌫', '雾凇'], 51: ['🌦', '毛毛雨'], 53: ['🌦', '小雨'], 55: ['🌧', '中雨'],
    61: ['🌧', '小雨'], 63: ['🌧', '中雨'], 65: ['🌧', '大雨'], 71: ['🌨', '小雪'], 73: ['🌨', '中雪'],
    75: ['❄️', '大雪'], 80: ['🌦', '阵雨'], 81: ['🌧', '阵雨'], 82: ['⛈', '强阵雨'], 95: ['⛈', '雷阵雨']
  };

  function dressAdvice(t) {
    if (t == null || isNaN(t)) return '填入气温后我给你推荐穿搭～';
    if (t >= 30) return '🥵 酷热：真丝/棉麻短袖、宽松半裙或短裤，戴帽子+墨镜，防晒必须 SPF50+。';
    if (t >= 28) return '☀️ 炎热：短袖 T 恤 / 连衣裙 + 凉鞋，随身带薄防晒衫应对空调房。';
    if (t >= 24) return '😎 温热：短袖 + 薄开衫备用，下装九分裤或半裙，早晚温差留意。';
    if (t >= 20) return '🍃 舒适：长袖 T / 衬衫 + 长裤，最百搭的温度，可以尽情叠穿配色。';
    if (t >= 17) return '🍂 微凉：薄卫衣 / 针织开衫 + 牛仔裤，加一条丝巾提亮。';
    if (t >= 12) return '🧥 转凉：风衣 / 夹克 + 内搭长袖，脚踝别露，容易受寒。';
    if (t >= 8) return '🧣 冷：厚毛衣 + 大衣，围巾登场，可以开始叠穿保暖内衣。';
    if (t >= 4) return '🥶 很冷：羊毛大衣 / 棉服 + 毛衣 + 保暖内搭，手套围巾帽子三件套。';
    return '❄️ 严寒：羽绒服 + 抓绒/羊绒内胆 + 保暖裤，注意头颈手脚保暖。';
  }
  function uvAdvice(uv) {
    if (uv == null || isNaN(uv)) return '';
    if (uv <= 2) return '紫外线弱，日常防晒即可（SPF15-30）。';
    if (uv <= 5) return '紫外线中等，出门涂 SPF30 防晒，两小时补涂。';
    if (uv <= 7) return '紫外线较强，SPF50 + 帽子 + 墨镜，避免正午暴晒。';
    if (uv <= 10) return '紫外线很强，硬防晒必须上：伞、帽、口罩、防晒衣。';
    return '紫外线极强！尽量减少 10:00-16:00 外出，全副武装。';
  }

  let curSec = 'clothes';
  let curCol = '全部';
  let autoW = DB.get('outfit.autoWeather', false);

  const getNotes = () => DB.get('outfit.notes', []);
  const setNotes = (v) => DB.set('outfit.notes', v);

  function render(root) {
    const w = DB.get('outfit.weather', {});
    root.innerHTML = `
      <div class="card" style="background:linear-gradient(135deg,#FFF6E2,#FFE9C6);border-color:var(--orange-l);">
        <div class="card-title"><span class="ci">${Icons.sun()}</span>今日天气 <small id="wDate">${today()}</small></div>
        <div class="row" style="margin-bottom:8px;">
          <span class="hint grow">联网自动定位并更新气温</span>
          <button class="chip sm ${autoW ? 'on' : ''}" id="wToggle">🔄 自动更新：${autoW ? '开' : '关'}</button>
        </div>
        <div class="row" style="align-items:flex-end;gap:14px;">
          <div>
            <div style="font-size:34px;font-weight:800;line-height:1;" id="wTemp">${w.temp != null ? w.temp + '°' : '--°'}</div>
            <div class="hint" id="wRange">${w.tmin != null ? `${w.tmin}° ~ ${w.tmax}°` : '点右侧按钮获取或手填'}</div>
          </div>
          <div class="grow">
            <div style="font-size:22px;" id="wIco">${w.ico || '🌤'}</div>
            <div style="font-size:12.5px;font-weight:700;" id="wCond">${esc(w.cond || '未知')}</div>
            <div class="hint" id="wUv">紫外线 ${w.uv != null ? w.uv : '--'}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:5px;">
            <button class="chip sm" id="wAuto">📍自动</button>
            <button class="chip sm" id="wEdit">✏️手填</button>
          </div>
        </div>
        <div class="divider"></div>
        <div style="font-size:12.8px;line-height:1.7;font-weight:600;" id="wAdvice">${dressAdvice(w.temp)}</div>
        <div class="hint" style="margin-top:4px;" id="wUvAdv">${uvAdvice(w.uv)}</div>
        <div class="divider"></div>
        <span class="lbl">今天我打算这么穿</span>
        <textarea class="field" id="wMyPlan" style="min-height:56px;" placeholder="记一下今天的穿搭想法…">${esc(DB.get('outfit.plan:' + today(), ''))}</textarea>
        <button class="btn sm block" id="wSavePlan" style="margin-top:8px;">保存今日穿搭记录</button>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.shirt()}</span>构建衣橱</div>
        <div class="tabs sub" id="secTabs">
          ${SECTIONS.map(s => `<div class="tab ${curSec === s.k ? 'active' : ''}" data-k="${s.k}">${s.ico} ${s.n}</div>`).join('')}
        </div>
        <div class="row" style="margin:9px 0;">
          <div class="chip-group grow" id="colGrp"></div>
        </div>
        <div class="row" style="margin-bottom:10px;">
          <button class="btn grow" id="noteAdd">${Icons.plus()}添加图文存档</button>
          <button class="btn ghost" id="colManage">合集</button>
        </div>
        <div class="grid2" id="noteGrid"></div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.pen()}</span>色彩搭配 <small>看到有意思的配色就存下来</small></div>
        <button class="btn ghost block sm" id="colorAdd" style="margin-bottom:10px;">${Icons.plus()}记一组配色</button>
        <div id="colorList"></div>
      </div>`;

    $$('#secTabs .tab').forEach(t => t.onclick = () => {
      curSec = t.dataset.k; curCol = '全部';
      $$('#secTabs .tab').forEach(x => x.classList.toggle('active', x === t));
      drawCols(); drawNotes();
    });
    $('#noteAdd').onclick = () => editNote(null);
    $('#colManage').onclick = manageCollections;
    $('#colorAdd').onclick = () => editColor(null);
    $('#wAuto').onclick = autoWeather;
    $('#wEdit').onclick = manualWeather;
    $('#wToggle').onclick = () => {
      autoW = !autoW;
      DB.set('outfit.autoWeather', autoW);
      $('#wToggle').classList.toggle('on', autoW);
      $('#wToggle').textContent = '🔄 自动更新：' + (autoW ? '开' : '关');
      if (autoW) autoWeather();
      else toast('已关闭自动更新');
    };
    $('#wSavePlan').onclick = () => { DB.set('outfit.plan:' + today(), $('#wMyPlan').value); toast('今日穿搭已记录 👗'); };

    drawCols(); drawNotes(); drawColors();
    // 开启自动更新且今日天气缺失/过期时，静默刷新一次
    if (autoW) {
      const w = DB.get('outfit.weather', {});
      if (!w || w.date !== today()) autoWeather();
    }
  }

  /* ---- 天气 ---- */
  function applyWeather(w) {
    DB.set('outfit.weather', w);
    $('#wTemp').textContent = w.temp != null ? w.temp + '°' : '--°';
    $('#wRange').textContent = w.tmin != null ? `${w.tmin}° ~ ${w.tmax}°` : '';
    $('#wIco').textContent = w.ico || '🌤';
    $('#wCond').textContent = w.cond || '未知';
    $('#wUv').textContent = '紫外线 ' + (w.uv != null ? w.uv : '--');
    $('#wAdvice').textContent = dressAdvice(w.temp);
    $('#wUvAdv').textContent = uvAdvice(w.uv);
  }

  function autoWeather() {
    const loc = DB.get('outfit.loc', null);
    if (loc && loc.la != null) { fetchWeather(loc.la, loc.lo); return; }
    if (!navigator.geolocation) { toast('设备不支持定位，手填吧～'); return manualWeather(); }
    toast('正在定位…');
    navigator.geolocation.getCurrentPosition((pos) => {
      const la = pos.coords.latitude, lo = pos.coords.longitude;
      DB.set('outfit.loc', { la, lo });
      fetchWeather(la, lo);
    }, () => { toast('定位被拒绝，手填吧～'); manualWeather(); }, { timeout: 8000 });
  }

  async function fetchWeather(la, lo) {
    try {
      const ctrl = new AbortController();
      const tm = setTimeout(() => ctrl.abort(), 8000);
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,uv_index_max&timezone=auto&forecast_days=1`, { signal: ctrl.signal });
      clearTimeout(tm);
      const j = await r.json();
      const code = j.current.weather_code;
      const wc = WEATHER_CODE[code] || ['🌤', '未知'];
      applyWeather({
        date: today(), temp: Math.round(j.current.temperature_2m),
        tmin: Math.round(j.daily.temperature_2m_min[0]), tmax: Math.round(j.daily.temperature_2m_max[0]),
        uv: Math.round(j.daily.uv_index_max[0]), cond: wc[1], ico: wc[0]
      });
      toast('天气已更新 ☀️');
    } catch (e) {
      toast('联网获取失败，手填一下吧');
      manualWeather();
    }
  }

  function manualWeather() {
    const w = DB.get('outfit.weather', {});
    modal.open('手动填写天气', `
      <div class="row"><div class="grow"><span class="lbl">当前气温 ℃</span><input class="field" id="mT" type="number" value="${w.temp != null ? w.temp : ''}"></div>
      <div class="grow"><span class="lbl">紫外线指数 0-11</span><input class="field" id="mU" type="number" value="${w.uv != null ? w.uv : ''}"></div></div>
      <div class="row" style="margin-top:8px;"><div class="grow"><span class="lbl">最低温</span><input class="field" id="mMin" type="number" value="${w.tmin != null ? w.tmin : ''}"></div>
      <div class="grow"><span class="lbl">最高温</span><input class="field" id="mMax" type="number" value="${w.tmax != null ? w.tmax : ''}"></div></div>
      <span class="lbl" style="margin-top:8px;">天气状况</span>
      <div class="chip-group" id="condGrp">
        ${[['☀️', '晴'], ['⛅', '多云'], ['☁️', '阴'], ['🌧', '雨'], ['⛈', '雷阵雨'], ['🌨', '雪'], ['🌫', '雾霾'], ['💨', '大风']].map(([i, n]) => `<button class="chip ${w.cond === n ? 'on' : ''}" data-i="${i}" data-n="${n}">${i} ${n}</button>`).join('')}
      </div>
      <button class="btn block" id="mSave" style="margin-top:12px;">保存</button>`, (b) => {
      let ico = w.ico || '🌤', cond = w.cond || '晴';
      $$('#condGrp .chip', b).forEach(c => c.onclick = () => {
        ico = c.dataset.i; cond = c.dataset.n;
        $$('#condGrp .chip', b).forEach(x => x.classList.toggle('on', x === c));
      });
      $('#mSave', b).onclick = () => {
        const num = (v) => v === '' ? null : Number(v);
        applyWeather({
          date: today(), temp: num($('#mT', b).value), uv: num($('#mU', b).value),
          tmin: num($('#mMin', b).value), tmax: num($('#mMax', b).value), cond, ico
        });
        modal.close(); toast('天气已保存');
      };
    });
  }

  /* ---- 合集 ---- */
  function drawCols() {
    const notes = getNotes().filter(n => n.type === curSec);
    const cols = ['全部', ...Array.from(new Set(notes.map(n => n.col).filter(Boolean)))];
    if (!cols.includes(curCol)) curCol = '全部';
    $('#colGrp').innerHTML = cols.map(c =>
      `<button class="chip sm ${curCol === c ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}${c !== '全部' ? ` ${notes.filter(n => n.col === c).length}` : ''}</button>`).join('');
    $$('#colGrp .chip').forEach(c => c.onclick = () => { curCol = c.dataset.c; drawCols(); drawNotes(); });
  }

  function manageCollections() {
    const notes = getNotes().filter(n => n.type === curSec);
    const cols = Array.from(new Set(notes.map(n => n.col).filter(Boolean)));
    modal.open('合集管理', `
      <div class="hint" style="margin-bottom:9px;">合集用于把同类笔记合并在一起，比如「秋冬通勤」「显白配色」。</div>
      <div id="colList">${cols.length ? cols.map(c => `
        <div class="rec-item"><div class="rec-ico">📁</div>
        <div class="rec-main"><div class="t">${esc(c)}</div><div class="s">${notes.filter(n => n.col === c).length} 条笔记</div></div>
        <button class="chip sm" data-ren="${esc(c)}">改名</button>
        <button class="chip sm" data-rm="${esc(c)}">解散</button></div>`).join('') : '<div class="empty">还没有合集，添加笔记时填写合集名即可自动创建</div>'}</div>`, (b) => {
      $$('[data-ren]', b).forEach(btn => btn.onclick = async () => {
        const old = btn.dataset.ren;
        const nv = await UI.promptBox('新的合集名称', old);
        if (!nv) return;
        const all = getNotes(); all.forEach(n => { if (n.type === curSec && n.col === old) n.col = nv; });
        setNotes(all); modal.close(); drawCols(); drawNotes(); toast('改好啦');
      });
      $$('[data-rm]', b).forEach(btn => btn.onclick = async () => {
        if (!(await confirmBox(`解散合集「${btn.dataset.rm}」？笔记会保留，只是不再归入合集。`))) return;
        const all = getNotes(); all.forEach(n => { if (n.type === curSec && n.col === btn.dataset.rm) n.col = ''; });
        setNotes(all); modal.close(); drawCols(); drawNotes(); toast('已解散');
      });
    });
  }

  /* ---- 图文笔记 ---- */
  function drawNotes() {
    let list = getNotes().filter(n => n.type === curSec);
    if (curCol !== '全部') list = list.filter(n => n.col === curCol);
    list.sort((a, b) => b.ts - a.ts);
    const g = $('#noteGrid');
    if (!list.length) {
      g.innerHTML = `<div class="empty" style="grid-column:1/-1;"><div class="e-ico">${Icons.fox()}</div>还没有存档～<br>看到顺眼的风格就存进来吧</div>`;
      return;
    }
    g.innerHTML = list.map(n => `
      <div class="pcard" data-id="${n.id}">
        ${n.imgs && n.imgs[0]
        ? `<img class="pimg" src="${n.imgs[0]}">`
        : `<div class="pimg ph">${Icons.shirt()}</div>`}
        <div class="pb">
          <div class="pt">${esc(n.title || '未命名')}</div>
          <div class="ps">${esc((n.text || '').slice(0, 40))}</div>
          <div class="pf">
            ${n.col ? `<span class="tag t-mid">📁${esc(n.col)}</span>` : ''}
            ${(n.tags || []).slice(0, 2).map(t => `<span class="tag t-soul">${esc(t)}</span>`).join('')}
            ${n.imgs && n.imgs.length > 1 ? `<span class="tag t-body">${n.imgs.length}图</span>` : ''}
          </div>
        </div>
      </div>`).join('');
    $$('#noteGrid .pcard').forEach(c => c.onclick = () => viewNote(c.dataset.id));
  }

  function viewNote(id) {
    const n = getNotes().find(x => x.id === id); if (!n) return;
    modal.open(n.title || '存档', `
      ${(n.imgs || []).map(s => `<img src="${s}" style="width:100%;border-radius:14px;margin-bottom:8px;">`).join('')}
      <div style="font-size:13.5px;line-height:1.8;white-space:pre-wrap;">${esc(n.text || '')}</div>
      <div class="chip-group" style="margin-top:9px;">
        ${n.col ? `<span class="chip sm">📁 ${esc(n.col)}</span>` : ''}
        ${(n.tags || []).map(t => `<span class="chip sm">#${esc(t)}</span>`).join('')}
      </div>
      <div class="hint" style="margin-top:6px;">${new Date(n.ts).toLocaleString('zh-CN')}</div>
      <div class="row" style="margin-top:12px;">
        <button class="btn ghost grow" id="nDel">删除</button>
        <button class="btn grow" id="nEdit">编辑</button>
      </div>`, (b) => {
      $('#nEdit', b).onclick = () => { modal.close(); editNote(id); };
      $('#nDel', b).onclick = async () => {
        if (await confirmBox('删除这条存档？')) { setNotes(getNotes().filter(x => x.id !== id)); modal.close(); drawCols(); drawNotes(); toast('已删除'); }
      };
    });
  }

  function editNote(id) {
    const all = getNotes();
    const n = id ? all.find(x => x.id === id) : { id: uid(), type: curSec, title: '', text: '', imgs: [], col: '', tags: [], ts: Date.now() };
    let imgs = (n.imgs || []).slice();
    const secName = (SECTIONS.find(s => s.k === curSec) || {}).n || '';
    modal.open((id ? '编辑' : '新增') + secName + '存档', `
      <span class="lbl">标题</span>
      <input class="field" id="nTitle" value="${esc(n.title)}" placeholder="比如：奶油色针织叠穿">
      <span class="lbl" style="margin-top:8px;">图片（可多张）</span>
      <div class="row wrap" id="imgBox" style="margin-bottom:6px;"></div>
      <button class="btn ghost sm" id="nAddImg">🖼 添加图片</button>
      <span class="lbl" style="margin-top:10px;">笔记内容</span>
      <textarea class="field" id="nText" style="min-height:110px;" placeholder="喜欢的点、单品来源、搭配思路…">${esc(n.text)}</textarea>
      <div class="row" style="margin-top:8px;">
        <div class="grow"><span class="lbl">合集（可留空）</span><input class="field" id="nCol" value="${esc(n.col || '')}" placeholder="秋冬通勤" list="colDL"></div>
        <div class="grow"><span class="lbl">标签（逗号分隔）</span><input class="field" id="nTags" value="${esc((n.tags || []).join(','))}" placeholder="显白,法式"></div>
      </div>
      <datalist id="colDL">${Array.from(new Set(all.filter(x => x.type === curSec).map(x => x.col).filter(Boolean))).map(c => `<option value="${esc(c)}"></option>`).join('')}</datalist>
      <button class="btn block" id="nSave" style="margin-top:12px;">保存</button>`, (b) => {
      const drawImgs = () => {
        $('#imgBox', b).innerHTML = imgs.map((s, i) =>
          `<div style="position:relative;"><img src="${s}" style="width:64px;height:80px;object-fit:cover;border-radius:9px;border:1.5px solid var(--line);">
          <span data-i="${i}" style="position:absolute;top:-6px;right:-6px;background:#E0806F;color:#fff;width:19px;height:19px;border-radius:50%;font-size:13px;display:flex;align-items:center;justify-content:center;">×</span></div>`).join('');
        $$('#imgBox span[data-i]', b).forEach(x => x.onclick = () => { imgs.splice(Number(x.dataset.i), 1); drawImgs(); });
      };
      drawImgs();
      $('#nAddImg', b).onclick = async () => { const im = await pickImage(900); if (im) { imgs.push(im); drawImgs(); } };
      $('#nSave', b).onclick = () => {
        const t = $('#nTitle', b).value.trim();
        if (!t && !imgs.length) { toast('至少写个标题或加张图'); return; }
        n.title = t; n.text = $('#nText', b).value; n.imgs = imgs;
        n.col = $('#nCol', b).value.trim();
        n.tags = $('#nTags', b).value.split(/[,，]/).map(x => x.trim()).filter(Boolean);
        n.type = curSec; n.ts = n.ts || Date.now();
        if (!id) all.push(n);
        setNotes(all); modal.close(); drawCols(); drawNotes(); toast('存好啦 ✨');
      };
    });
  }

  /* ---- 色彩搭配 ---- */
  function drawColors() {
    const list = DB.get('outfit.colors', []).slice().sort((a, b) => b.ts - a.ts);
    const box = $('#colorList');
    if (!list.length) {
      box.innerHTML = `<div class="empty"><div class="e-ico">${Icons.chick()}</div>还没有配色记录～<br>三花猫配色：米白 + 咖啡棕 + 橘黄，先来一组？</div>`;
      return;
    }
    box.innerHTML = list.map(c => `
      <div class="card tight" data-id="${c.id}" style="margin-bottom:9px;">
        <div class="color-sw">${c.colors.map(x => `<i style="background:${x}"></i>`).join('')}</div>
        <div class="row" style="margin-top:7px;">
          <div class="grow"><b style="font-size:13px;">${esc(c.name)}</b>
          <div class="hint">${esc(c.note || '')}</div></div>
          <span class="chip sm" data-act="del">删</span>
        </div>
        <div class="chip-group" style="margin-top:6px;">${c.colors.map(x => `<span class="chip sm" style="font-family:monospace;">${x}</span>`).join('')}</div>
      </div>`).join('');
    box.onclick = (e) => {
      const card = e.target.closest('[data-id]'); if (!card) return;
      if (e.target.dataset.act === 'del') {
        DB.set('outfit.colors', DB.get('outfit.colors', []).filter(x => x.id !== card.dataset.id));
        drawColors(); toast('已删除'); return;
      }
      editColor(card.dataset.id);
    };
  }

  function editColor(id) {
    const all = DB.get('outfit.colors', []);
    const c = id ? all.find(x => x.id === id) : { id: uid(), name: '', colors: ['#FAF0DC', '#6B4630', '#F2A340'], note: '', ts: Date.now() };
    modal.open(id ? '编辑配色' : '记一组配色', `
      <span class="lbl">配色名称</span>
      <input class="field" id="cName" value="${esc(c.name)}" placeholder="比如：三花猫配色">
      <span class="lbl" style="margin-top:9px;">颜色（点色块修改，最多 6 个）</span>
      <div class="row wrap" id="cColors"></div>
      <div class="row" style="margin-top:7px;">
        <button class="btn ghost sm" id="cAdd">+ 加一个颜色</button>
        <button class="btn ghost sm" id="cRandom">🎲 随机灵感</button>
      </div>
      <span class="lbl" style="margin-top:9px;">笔记</span>
      <textarea class="field" id="cNote" style="min-height:70px;" placeholder="适合什么场合、为什么好看…">${esc(c.note || '')}</textarea>
      <button class="btn block" id="cSave" style="margin-top:12px;">保存</button>`, (b) => {
      let cols = c.colors.slice();
      const draw = () => {
        $('#cColors', b).innerHTML = cols.map((x, i) => `
          <div style="position:relative;">
            <input type="color" value="${x}" data-i="${i}" style="width:52px;height:52px;border:none;background:none;padding:0;">
            <span data-rm="${i}" style="position:absolute;top:-4px;right:-4px;background:#E0806F;color:#fff;width:17px;height:17px;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center;">×</span>
          </div>`).join('');
        $$('#cColors input[type=color]', b).forEach(inp => inp.oninput = () => { cols[Number(inp.dataset.i)] = inp.value; });
        $$('#cColors span[data-rm]', b).forEach(s => s.onclick = () => { if (cols.length > 1) { cols.splice(Number(s.dataset.rm), 1); draw(); } });
      };
      draw();
      $('#cAdd', b).onclick = () => { if (cols.length < 6) { cols.push('#DDDDDD'); draw(); } };
      $('#cRandom', b).onclick = () => {
        const P = [['#FAF0DC', '#6B4630', '#F2A340'], ['#EDE6DC', '#7C8C7A', '#C9A66B'], ['#FDF0F0', '#D98B8B', '#8C6647'],
        ['#E8EEF2', '#5789A9', '#F0C987'], ['#F5F0E1', '#3E4E50', '#C4703E'], ['#FFF4E6', '#B0764F', '#7A9E7E']];
        cols = P[Math.floor(Math.random() * P.length)].slice(); draw();
      };
      $('#cSave', b).onclick = () => {
        c.name = $('#cName', b).value.trim() || '未命名配色';
        c.colors = cols; c.note = $('#cNote', b).value;
        if (!id) all.push(c);
        DB.set('outfit.colors', all); modal.close(); drawColors(); toast('配色存好啦 🎨');
      };
    });
  }

  window.Modules = window.Modules || {};
  window.Modules.outfit = { id: 'outfit', name: '穿搭表达', desc: '狐狸帮你搭出高级感', icon: 'fox', render };
})();

</script>
<script>
/* ===== 模块 6：化妆护肤 ===== */
(function () {
  const { $, $$, esc, uid, today, toast, modal, confirmBox, promptBox, pickImage, longPress } = UI;

  const PROD_CATS = ['防晒', '卸妆', '洁面', '化妆水', '精华', '乳液面霜', '眼霜', '面膜', '身体乳', '护发精油', '洗发水', '底妆', '口红', '香水', '其他'];
  const DEF_STEPS = ['卸妆', '洁面', '化妆水/爽肤水', '精华', '眼霜', '乳液/面霜', '防晒（早）', '面膜（每周 2-3 次）'];

  const SEASON_TIPS = {
    春: {
      t: '春季 · 换季敏感期',
      list: [
        '气温回升出油增多，但屏障还没完全恢复，别急着上强功效酸类。',
        '洁面换成氨基酸类，早晚各一次，水温 32-34℃。',
        '柳絮花粉季易泛红，精简护肤：水 + 修护精华 + 清爽乳。',
        '防晒从春天就要开始，SPF30 PA+++ 起步，紫外线不看温度。',
        '混油皮建议 T 区控油乳、两颊保湿乳分区护理。'
      ]
    },
    夏: {
      t: '夏季 · 控油防晒主场',
      list: [
        '出油高峰，清洁要够但不能过度：早晨可只用清水或极温和洁面。',
        '质地全面换轻薄：凝露、无油乳液、水感防晒。',
        '防晒 SPF50+ PA++++，每 2-3 小时补涂（防晒喷雾/气垫补）。',
        '每周 1-2 次清洁面膜（高岭土），之后立刻补水面膜镇定。',
        '烟酰胺 + 水杨酸组合可控油缩毛孔，但要建立耐受，从每周 2 次开始。',
        '空调房记得放加湿器，外油内干就是这么来的。'
      ]
    },
    秋: {
      t: '秋季 · 修护屏障黄金期',
      list: [
        '出油减少、水分流失加快，护肤重点从"控油"转向"锁水"。',
        '加入神经酰胺、角鲨烷类修护成分，把夏天折腾的屏障补回来。',
        '功效护肤（A 醇、果酸）最适合在秋冬开始建立耐受，从低浓度隔天用。',
        '防晒不能停，秋天的 UVA 依然很强。',
        '身体也要保湿了，洗澡后 3 分钟内涂身体乳效果最好。'
      ]
    },
    冬: {
      t: '冬季 · 保湿锁水攻坚',
      list: [
        '面霜换成滋润型，混油皮 T 区可少涂、两颊厚涂。',
        '洁面频率降低，晚上认真洗，早上清水或温和洁面。',
        '室内暖气干燥，加湿器保持湿度 45-60%。',
        '嘴唇和手部最容易开裂，唇膏和护手霜随身带。',
        '热水澡时间控制在 10 分钟内，太烫会带走皮脂膜。',
        '冬天照样要防晒，雪地反射紫外线更强。'
      ]
    }
  };

  const OILY_DRY = [
    '认清本质：混油皮 = T 区油 + 两颊干/正常，核心矛盾是"控油"和"保湿"要分开做。',
    '不要用强力清洁产品全脸，皂基洁面只会让 T 区越洗越油、两颊越洗越干。',
    '分区护理：T 区用控油精华/凝露，两颊用滋润乳霜，一瓶走天下不适合你。',
    '补水 ≠ 保湿。补水是给角质层加水，保湿是把水锁住，两步都要有。',
    '毛孔粗大的根源是出油和老废角质堆积，烟酰胺 + 水杨酸 + 认真防晒是长期方案。',
    '爆痘期停用所有厚重乳霜和彩妆，做减法比堆产品有用。',
    '睡眠、控糖、少奶茶对油脂分泌的影响，比换十瓶精华都大。',
    '任何新产品先耳后/下颌线试用 3 天，别在脸上做实验。'
  ];

  const seasonOf = (m) => (m >= 3 && m <= 5) ? '春' : (m >= 6 && m <= 8) ? '夏' : (m >= 9 && m <= 11) ? '秋' : '冬';
  const quarterOf = (d) => `${d.getFullYear()}-Q${Math.floor(d.getMonth() / 3) + 1}`;

  let side = 'skin';
  let curQ = quarterOf(new Date());

  function render(root) {
    side = DB.get('beauty.side', 'skin');
    root.innerHTML = `
      <div class="slide-switch ${side === 'makeup' ? 'right' : ''}" id="bSw">
        <div class="thumb"></div>
        <div class="sw ${side === 'skin' ? 'on' : ''}" data-s="skin">🧴 护肤</div>
        <div class="sw ${side === 'makeup' ? 'on' : ''}" data-s="makeup">💄 化妆</div>
      </div>
      <div id="bPane"></div>`;
    $$('#bSw .sw').forEach(s => s.onclick = () => {
      side = s.dataset.s; DB.set('beauty.side', side);
      $('#bSw').classList.toggle('right', side === 'makeup');
      $$('#bSw .sw').forEach(x => x.classList.toggle('on', x === s));
      paint();
    });
    paint();
  }
  function paint() { side === 'skin' ? renderSkin($('#bPane')) : renderMakeup($('#bPane')); }

  /* ============ 护肤 ============ */
  function renderSkin(p) {
    const m = new Date().getMonth() + 1;
    const sea = seasonOf(m);
    const tip = SEASON_TIPS[sea];
    p.innerHTML = `
      <div class="card" style="background:linear-gradient(135deg,#FFF7EC,#FFEFE0);border-color:var(--orange-l);">
        <div class="card-title"><span class="ci">${Icons.sheep()}</span>混油皮变好指南 <small>${m} 月 · ${tip.t}</small></div>
        <ul class="bullet" style="margin-bottom:8px;">${tip.list.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
        <div class="acc" data-a="core"><div class="acc-h">📌 混油皮长期心法（点开）<span class="ar">▾</span></div>
          <div class="acc-b">${OILY_DRY.map((x, i) => `${i + 1}. ${esc(x)}`).join('\n')}</div></div>
        <div class="chip-group" style="margin-top:8px;">
          ${Object.keys(SEASON_TIPS).map(s => `<button class="chip sm ${s === sea ? 'on' : ''}" data-sea="${s}">${s}季方案</button>`).join('')}
        </div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.pen()}</span>我的护肤顺序 <small>可自由编辑排序</small></div>
        <div id="stepList"></div>
        <div class="row" style="margin-top:8px;">
          <button class="btn ghost sm grow" id="stepAdd">${Icons.plus()}加一步</button>
          <button class="btn ghost sm grow" id="stepReset">恢复默认</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.lipstick()}</span>季度在用产品
          <small><button class="chip sm" id="qPrev">‹</button> <b id="qLbl" style="padding:0 5px;"></b> <button class="chip sm" id="qNext">›</button></small>
        </div>
        <button class="btn block sm" id="prodAdd" style="margin-bottom:10px;">${Icons.plus()}记录一个产品</button>
        <div id="prodList"></div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.book()}</span>护肤心得 & 体验收藏 <small id="diaryCnt"></small></div>
        <div class="row" style="margin-bottom:9px;">
          <button class="btn grow sm" id="expAdd">${Icons.plus()}写一条心得</button>
          <button class="btn ghost sm" id="expFav">⭐ 只看收藏</button>
        </div>
        <div id="expList"></div>
      </div>`;

    $$('[data-sea]').forEach(b => b.onclick = () => {
      const s = b.dataset.sea, t2 = SEASON_TIPS[s];
      modal.open(t2.t, `<ul class="bullet">${t2.list.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`);
    });
    $$('#bPane .acc').forEach(a => a.querySelector('.acc-h').onclick = () => a.classList.toggle('open'));

    drawSteps(); drawProds(); drawExp();
    $('#stepAdd').onclick = async () => {
      const v = await promptBox('新增护肤步骤', '', '比如：精华油');
      if (!v) return;
      const s = DB.get('beauty.steps', DEF_STEPS.slice()); s.push(v); DB.set('beauty.steps', s); drawSteps();
    };
    $('#stepReset').onclick = async () => {
      if (await confirmBox('恢复成默认护肤顺序？你自定义的步骤会被覆盖。')) { DB.set('beauty.steps', DEF_STEPS.slice()); drawSteps(); toast('已恢复'); }
    };
    $('#qPrev').onclick = () => { curQ = shiftQ(curQ, -1); drawProds(); };
    $('#qNext').onclick = () => { curQ = shiftQ(curQ, 1); drawProds(); };
    $('#prodAdd').onclick = () => editProd(null);
    $('#expAdd').onclick = () => editExp(null);
    $('#expFav').onclick = (e) => {
      const f = !DB.get('beauty.favOnly', false);
      DB.set('beauty.favOnly', f);
      e.target.textContent = f ? '⭐ 显示全部' : '⭐ 只看收藏';
      drawExp();
    };
    $('#expFav').textContent = DB.get('beauty.favOnly', false) ? '⭐ 显示全部' : '⭐ 只看收藏';
  }

  function shiftQ(q, d) {
    let [y, qq] = q.split('-Q').map(Number);
    qq += d;
    if (qq > 4) { qq = 1; y++; } if (qq < 1) { qq = 4; y--; }
    return `${y}-Q${qq}`;
  }

  function drawSteps() {
    const steps = DB.get('beauty.steps', DEF_STEPS.slice());
    $('#stepList').innerHTML = steps.map((s, i) => `
      <div class="plan-day" data-i="${i}" style="padding:7px 9px;">
        <div class="pd" style="width:28px;height:28px;flex:0 0 28px;border-radius:10px;font-size:12px;">${i + 1}</div>
        <div class="grow" style="font-size:13px;font-weight:700;line-height:28px;">${esc(s)}</div>
        <button class="chip sm" data-act="up">↑</button>
        <button class="chip sm" data-act="down">↓</button>
        <button class="chip sm" data-act="del">×</button>
      </div>`).join('');
    $('#stepList').onclick = (e) => {
      const act = e.target.dataset.act; if (!act) return;
      const i = Number(e.target.closest('[data-i]').dataset.i);
      const s = DB.get('beauty.steps', DEF_STEPS.slice());
      if (act === 'up' && i > 0) { [s[i - 1], s[i]] = [s[i], s[i - 1]]; }
      if (act === 'down' && i < s.length - 1) { [s[i + 1], s[i]] = [s[i], s[i + 1]]; }
      if (act === 'del') s.splice(i, 1);
      DB.set('beauty.steps', s); drawSteps();
    };
  }

  function drawProds() {
    $('#qLbl').textContent = curQ.replace('-Q', ' 年 Q') + ' 季度';
    const all = DB.get('beauty.products', {});
    const list = all[curQ] || [];
    const box = $('#prodList');
    if (!list.length) {
      box.innerHTML = `<div class="empty"><div class="e-ico">${Icons.sheep()}</div>这个季度还没记录～<br>防晒、精华、身体乳都可以记下来</div>`;
      return;
    }
    const byCat = {};
    list.forEach(p => { (byCat[p.cat] = byCat[p.cat] || []).push(p); });
    box.innerHTML = Object.keys(byCat).map(c => `
      <div style="margin-bottom:10px;">
        <div class="lbl" style="font-size:12px;">${esc(c)}</div>
        ${byCat[c].map(p => `
          <div class="rec-item" data-id="${p.id}">
            <div class="rec-ico">${p.img ? `<img src="${p.img}" style="width:100%;height:100%;object-fit:cover;border-radius:10px;">` : '🧴'}</div>
            <div class="rec-main"><div class="t">${esc(p.name)}</div>
            <div class="s">${'⭐'.repeat(p.rate || 0)}${p.note ? ' · ' + esc(p.note) : ''}</div></div>
            <span class="chip sm">${p.repurchase ? '会回购' : '在用'}</span>
          </div>`).join('')}
      </div>`).join('');
    $$('#prodList .rec-item').forEach(it => it.onclick = () => editProd(it.dataset.id));
  }

  function editProd(id) {
    const all = DB.get('beauty.products', {});
    const list = all[curQ] || [];
    const p = id ? list.find(x => x.id === id) : { id: uid(), cat: '防晒', name: '', note: '', rate: 4, img: '', repurchase: false };
    modal.open(id ? '编辑产品' : '记录产品', `
      <span class="lbl">类别</span>
      <div class="chip-group" id="pcGrp" style="max-height:96px;overflow-y:auto;">
        ${PROD_CATS.map(c => `<button class="chip sm ${p.cat === c ? 'on' : ''}" data-c="${c}">${c}</button>`).join('')}
      </div>
      <span class="lbl" style="margin-top:9px;">产品名</span>
      <input class="field" id="pName" value="${esc(p.name)}" placeholder="品牌 + 名称">
      <div class="row" style="margin-top:9px;align-items:center;">
        <div class="grow"><span class="lbl">评分</span>
          <div class="chip-group" id="rateGrp">${[1, 2, 3, 4, 5].map(n => `<button class="chip sm ${p.rate === n ? 'on' : ''}" data-r="${n}">${n}⭐</button>`).join('')}</div>
        </div>
      </div>
      <span class="lbl" style="margin-top:9px;">使用感受</span>
      <textarea class="field" id="pNote" style="min-height:72px;">${esc(p.note || '')}</textarea>
      <div class="row" style="margin-top:9px;">
        <button class="chip ${p.repurchase ? 'on' : ''}" id="pRe">🔁 会回购</button>
        <button class="btn ghost sm" id="pImg">🖼 加图</button>
        <span id="pImgBox"></span>
      </div>
      <div class="row" style="margin-top:12px;">
        ${id ? '<button class="btn danger grow" id="pDel">删除</button>' : ''}
        <button class="btn grow" id="pSave">保存</button>
      </div>`, (b) => {
      let cat = p.cat, rate = p.rate || 0, re = !!p.repurchase, img = p.img || '';
      const drawImg = () => { $('#pImgBox', b).innerHTML = img ? `<img src="${img}" style="width:44px;height:44px;object-fit:cover;border-radius:10px;">` : ''; };
      drawImg();
      $$('#pcGrp .chip', b).forEach(c => c.onclick = () => { cat = c.dataset.c; $$('#pcGrp .chip', b).forEach(x => x.classList.toggle('on', x === c)); });
      $$('#rateGrp .chip', b).forEach(c => c.onclick = () => { rate = Number(c.dataset.r); $$('#rateGrp .chip', b).forEach(x => x.classList.toggle('on', x === c)); });
      $('#pRe', b).onclick = () => { re = !re; $('#pRe', b).classList.toggle('on', re); };
      $('#pImg', b).onclick = async () => { const i2 = await pickImage(400); if (i2) { img = i2; drawImg(); } };
      $('#pSave', b).onclick = () => {
        const n = $('#pName', b).value.trim();
        if (!n) { toast('产品名写一下～'); return; }
        Object.assign(p, { cat, name: n, note: $('#pNote', b).value, rate, repurchase: re, img });
        if (!id) list.push(p);
        all[curQ] = list; DB.set('beauty.products', all);
        modal.close(); drawProds(); toast('记好啦 🧴');
      };
      if (id) $('#pDel', b).onclick = async () => {
        if (await confirmBox('删除这个产品记录？')) {
          all[curQ] = list.filter(x => x.id !== id); DB.set('beauty.products', all);
          modal.close(); drawProds(); toast('已删除');
        }
      };
    });
  }

  function drawExp() {
    let list = DB.get('beauty.exp', []).slice().sort((a, b) => b.ts - a.ts);
    if (DB.get('beauty.favOnly', false)) list = list.filter(x => x.fav);
    $('#diaryCnt').textContent = list.length ? `${list.length} 条` : '';
    const box = $('#expList');
    if (!list.length) {
      box.innerHTML = `<div class="empty"><div class="e-ico">${Icons.koala()}</div>还没有心得～<br>记录踩雷和真爱，未来的你会感谢现在的自己</div>`;
      return;
    }
    box.innerHTML = list.map(e => `
      <div class="card tight" data-id="${e.id}" style="margin-bottom:8px;">
        <div class="row" style="align-items:flex-start;">
          <div class="grow">
            <b style="font-size:13px;">${esc(e.title || '护肤心得')}</b>
            <div class="hint" style="margin-top:2px;">${new Date(e.ts).toLocaleDateString('zh-CN')}</div>
          </div>
          <span class="chip sm ${e.fav ? 'on' : ''}" data-act="fav">⭐</span>
          <span class="chip sm" data-act="del">×</span>
        </div>
        ${e.img ? `<img src="${e.img}" style="width:100%;border-radius:11px;margin-top:7px;">` : ''}
        <div style="font-size:12.6px;line-height:1.75;margin-top:6px;white-space:pre-wrap;">${esc(e.text || '')}</div>
      </div>`).join('');
    box.onclick = (e) => {
      const c = e.target.closest('[data-id]'); if (!c) return;
      const arr = DB.get('beauty.exp', []);
      const i = arr.findIndex(x => x.id === c.dataset.id); if (i < 0) return;
      if (e.target.dataset.act === 'fav') { arr[i].fav = !arr[i].fav; DB.set('beauty.exp', arr); drawExp(); }
      else if (e.target.dataset.act === 'del') { confirmBox('删除这条心得？').then(ok => { if (ok) { arr.splice(i, 1); DB.set('beauty.exp', arr); drawExp(); toast('已删除'); } }); }
      else editExp(c.dataset.id);
    };
  }

  function editExp(id) {
    const arr = DB.get('beauty.exp', []);
    const e = id ? arr.find(x => x.id === id) : { id: uid(), title: '', text: '', img: '', fav: false, ts: Date.now() };
    modal.open(id ? '编辑心得' : '写一条护肤心得', `
      <input class="field" id="eTitle" value="${esc(e.title)}" placeholder="标题，比如：夏天控油组合">
      <textarea class="field" id="eText" style="min-height:120px;margin-top:9px;" placeholder="用了什么、皮肤反应、值不值得回购…">${esc(e.text)}</textarea>
      <div class="row" style="margin-top:9px;">
        <button class="btn ghost sm" id="eImg">🖼 加张图</button>
        <span id="eImgBox"></span>
      </div>
      <button class="btn block" id="eSave" style="margin-top:12px;">保存</button>`, (b) => {
      let img = e.img || '';
      const dr = () => { $('#eImgBox', b).innerHTML = img ? `<img src="${img}" style="width:48px;height:48px;object-fit:cover;border-radius:10px;">` : ''; };
      dr();
      $('#eImg', b).onclick = async () => { const i2 = await pickImage(800); if (i2) { img = i2; dr(); } };
      $('#eSave', b).onclick = () => {
        e.title = $('#eTitle', b).value.trim();
        e.text = $('#eText', b).value;
        e.img = img;
        if (!e.title && !e.text) { toast('写点内容呀'); return; }
        if (!id) arr.push(e);
        DB.set('beauty.exp', arr); modal.close(); drawExp(); toast('保存好啦');
      };
    });
  }

  /* ============ 化妆 ============ */
  function renderMakeup(p) {
    p.innerHTML = `
      <div class="card">
        <div class="card-title"><span class="ci">${Icons.lipstick()}</span>教程链接收藏 <small>长按卡片直接打开</small></div>
        <div class="row" style="margin-bottom:10px;">
          <button class="btn grow" id="linkAdd">${Icons.plus()}添加链接</button>
          <button class="btn ghost" id="linkPaste">📋 粘贴</button>
        </div>
        <div id="linkList"></div>
        <div class="hint" style="margin-top:6px;">支持小红书 / 抖音 / B站 等任意链接。长按 0.6 秒即可跳转打开，轻点是编辑。</div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.photo()}</span>喜欢的妆容风格 <small>便签 + 图片</small></div>
        <button class="btn block sm" id="mnAdd" style="margin-bottom:10px;">${Icons.plus()}贴一张风格便签</button>
        <div class="grid2" id="mnGrid"></div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.star()}</span>化妆小抄</div>
        <div class="acc"><div class="acc-h">🎨 底妆不卡粉<span class="ar">▾</span></div>
          <div class="acc-b">1. 妆前保湿要吸收完全，急了就是搓泥。\n2. 混油皮 T 区用控油妆前，两颊用保湿妆前，分区处理。\n3. 粉底少量多次，海绵微湿按压比刷子更服帖。\n4. 定妆只在 T 区和易脱妆处，全脸厚定妆容易斑驳。</div></div>
        <div class="acc"><div class="acc-h">👁 眼妆放大眼型<span class="ar">▾</span></div>
          <div class="acc-b">1. 眼影三色法：浅色打底 → 中间色晕染双眼皮褶 → 深色压眼尾。\n2. 内眼角提亮，眼尾自然拉长 2-3mm。\n3. 睫毛夹分三段夹，睫毛膏 Z 字形刷。\n4. 下睫毛后半段带一点点，眼睛更圆更亮。</div></div>
        <div class="acc"><div class="acc-h">💋 唇妆显气色<span class="ar">▾</span></div>
          <div class="acc-b">1. 先去角质 + 唇膏打底。\n2. 黄皮避雷正红偏蓝调，选番茄红、豆沙、焦糖。\n3. 唇中点涂晕开 = 日常；描边填满 = 正式。\n4. 唇色和腮红同色系，整体更协调。</div></div>
        <div class="acc"><div class="acc-h">✨ 卸妆要彻底<span class="ar">▾</span></div>
          <div class="acc-b">1. 眼唇专用卸妆湿敷 20 秒再擦。\n2. 全脸卸妆油乳化到位（加水打圈变白）再冲。\n3. 卸妆后温和洁面二次清洁，但别过度搓揉。\n4. 卸完立刻补水，别让皮肤晾着。</div></div>
      </div>`;

    drawLinks(); drawMakeupNotes();
    $('#linkAdd').onclick = () => editLink(null);
    $('#linkPaste').onclick = async () => {
      try {
        const t = await navigator.clipboard.readText();
        if (t && /https?:\/\//.test(t)) editLink(null, t.match(/https?:\/\/[^\s]+/)[0]);
        else toast('剪贴板里没有链接');
      } catch (e) { toast('读取剪贴板失败，手动粘贴吧'); editLink(null); }
    };
    $('#mnAdd').onclick = () => editMakeupNote(null);
    $$('#bPane .acc').forEach(a => a.querySelector('.acc-h').onclick = () => a.classList.toggle('open'));
  }

  function platOf(url) {
    if (/xiaohongshu|xhslink/.test(url)) return ['小红书', 'p-xhs', '书'];
    if (/douyin|iesdouyin/.test(url)) return ['抖音', 'p-dy', '抖'];
    if (/bilibili|b23\.tv/.test(url)) return ['B站', 'p-other', 'B'];
    if (/weibo/.test(url)) return ['微博', 'p-other', '微'];
    return ['链接', 'p-other', '链'];
  }

  function drawLinks() {
    const list = DB.get('beauty.links', []).slice().sort((a, b) => b.ts - a.ts);
    const box = $('#linkList');
    if (!list.length) {
      box.innerHTML = `<div class="empty"><div class="e-ico">${Icons.lipstick()}</div>还没有收藏链接～<br>看到好教程就存下来吧</div>`;
      return;
    }
    box.innerHTML = list.map(l => {
      const [pn, pc, pt] = platOf(l.url || '');
      return `<div class="link-item" data-id="${l.id}">
        <div class="link-plat ${pc}">${pt}</div>
        <div class="rec-main"><div class="t">${esc(l.title || pn + '教程')}</div>
        <div class="s">${esc((l.note || l.url || '').slice(0, 40))}</div></div>
        <span class="chip sm" data-act="open">打开</span>
      </div>`;
    }).join('');
    $$('#linkList .link-item').forEach(it => {
      const id = it.dataset.id;
      const open = () => {
        const l = DB.get('beauty.links', []).find(x => x.id === id);
        if (!l || !l.url) { toast('没有有效链接'); return; }
        window.open(l.url, '_blank');
      };
      longPress(it, open, 600);
      it.onclick = (e) => { if (e.target.dataset.act === 'open') open(); else editLink(id); };
    });
  }

  function editLink(id, preset) {
    const all = DB.get('beauty.links', []);
    const l = id ? all.find(x => x.id === id) : { id: uid(), title: '', url: preset || '', note: '', ts: Date.now() };
    modal.open(id ? '编辑链接' : '添加链接', `
      <span class="lbl">链接地址</span>
      <input class="field" id="lUrl" value="${esc(l.url)}" placeholder="粘贴小红书 / 抖音链接">
      <span class="lbl" style="margin-top:9px;">标题</span>
      <input class="field" id="lTitle" value="${esc(l.title)}" placeholder="比如：伪素颜通勤妆教程">
      <span class="lbl" style="margin-top:9px;">备注</span>
      <textarea class="field" id="lNote" style="min-height:64px;">${esc(l.note || '')}</textarea>
      <div class="row" style="margin-top:12px;">
        ${id ? '<button class="btn danger grow" id="lDel">删除</button>' : ''}
        <button class="btn grow" id="lSave">保存</button>
      </div>`, (b) => {
      $('#lSave', b).onclick = () => {
        const u = $('#lUrl', b).value.trim();
        const m = u.match(/https?:\/\/[^\s]+/);
        l.url = m ? m[0] : u;
        l.title = $('#lTitle', b).value.trim();
        l.note = $('#lNote', b).value.trim();
        if (!l.url && !l.title) { toast('至少填个链接或标题'); return; }
        if (!id) all.push(l);
        DB.set('beauty.links', all); modal.close(); drawLinks(); toast('收藏好啦 💄');
      };
      if (id) $('#lDel', b).onclick = async () => {
        if (await confirmBox('删除这条链接？')) { DB.set('beauty.links', all.filter(x => x.id !== id)); modal.close(); drawLinks(); toast('已删除'); }
      };
    });
  }

  function drawMakeupNotes() {
    const list = DB.get('beauty.mnotes', []).slice().sort((a, b) => b.ts - a.ts);
    const g = $('#mnGrid');
    if (!list.length) {
      g.innerHTML = `<div class="empty" style="grid-column:1/-1;"><div class="e-ico">${Icons.chick()}</div>还没有风格便签～</div>`;
      return;
    }
    g.innerHTML = list.map(n => `
      <div class="pcard" data-id="${n.id}">
        ${n.img ? `<img class="pimg" src="${n.img}">` : `<div class="pimg ph">${Icons.lipstick()}</div>`}
        <div class="pb"><div class="pt">${esc(n.title || '风格便签')}</div>
        <div class="ps">${esc((n.text || '').slice(0, 36))}</div></div>
      </div>`).join('');
    $$('#mnGrid .pcard').forEach(c => c.onclick = () => editMakeupNote(c.dataset.id));
  }

  function editMakeupNote(id) {
    const all = DB.get('beauty.mnotes', []);
    const n = id ? all.find(x => x.id === id) : { id: uid(), title: '', text: '', img: '', ts: Date.now() };
    modal.open(id ? '编辑便签' : '风格便签', `
      <input class="field" id="mTitle" value="${esc(n.title)}" placeholder="风格名，比如：清冷氛围感">
      <textarea class="field" id="mText" style="min-height:110px;margin-top:9px;" placeholder="妆容要点、用到的产品…">${esc(n.text)}</textarea>
      <div class="row" style="margin-top:9px;">
        <button class="btn ghost sm" id="mImg">🖼 图片</button><span id="mImgBox"></span>
      </div>
      <div class="row" style="margin-top:12px;">
        ${id ? '<button class="btn danger grow" id="mDel">删除</button>' : ''}
        <button class="btn grow" id="mSave">保存</button>
      </div>`, (b) => {
      let img = n.img || '';
      const dr = () => { $('#mImgBox', b).innerHTML = img ? `<img src="${img}" style="width:52px;height:52px;object-fit:cover;border-radius:10px;">` : ''; };
      dr();
      $('#mImg', b).onclick = async () => { const i2 = await pickImage(900); if (i2) { img = i2; dr(); } };
      $('#mSave', b).onclick = () => {
        n.title = $('#mTitle', b).value.trim(); n.text = $('#mText', b).value; n.img = img;
        if (!n.title && !n.text && !img) { toast('写点什么呀'); return; }
        if (!id) all.push(n);
        DB.set('beauty.mnotes', all); modal.close(); drawMakeupNotes(); toast('贴好啦');
      };
      if (id) $('#mDel', b).onclick = async () => {
        if (await confirmBox('删除这张便签？')) { DB.set('beauty.mnotes', all.filter(x => x.id !== id)); modal.close(); drawMakeupNotes(); toast('已删除'); }
      };
    });
  }

  window.Modules = window.Modules || {};
  window.Modules.beauty = { id: 'beauty', name: '化妆护肤', desc: '羊咩咩的变美笔记', icon: 'sheep', render };
})();

</script>
<script>
/* ===== 模块 7：深度地球 online ===== */
(function () {
  const { $, $$, esc, uid, today, toast, modal, confirmBox, promptBox, pickImage } = UI;

  const NOTE_COLORS = ['#FFF3C4', '#FFE0DC', '#E1EFD9', '#E0EDF6', '#EEE6F6', '#FFE9C8'];
  let view = 'list';
  let deepView = 'list';
  let curId = null;

  const getPages = () => DB.get('deep.pages', []);
  const setPages = (v) => DB.set('deep.pages', v);

  function render(root) {
    if (view === 'page' && curId && getPages().find(p => p.id === curId)) renderPage(root);
    else if (deepView === 'timeline') renderTimeline(root);
    else { view = 'list'; renderList(root); }
  }

  /* ---- 列表 ---- */
  function renderList(root) {
    const pages = getPages().slice().sort((a, b) => (b.updated || b.ts) - (a.updated || a.ts));
    root.innerHTML = `
      <div class="card" style="background:linear-gradient(135deg,#EAF3F8,#F7F1E4);border-color:#CFE0EA;">
        <div class="card-title"><span class="ci">${Icons.globe()}</span>深度地球 online</div>
        <div class="hint" style="line-height:1.75;">在这里记录你对某件事物的深度体验：一本书、一次旅行、一个爱好、一段关系、一门手艺。
        每个页面都可以自由组合<b>文字段落 / 图片 / 表格 / 彩色便签</b>，像做一份自己的研究报告。</div>
        <div class="row" style="margin-top:9px;gap:6px;">
          <button class="chip sm ${deepView === 'list' ? 'on' : ''}" id="vwList">📋 列表</button>
          <button class="chip sm ${deepView === 'timeline' ? 'on' : ''}" id="vwTl">🗓 时间轴</button>
        </div>
        <button class="btn block" id="newPage" style="margin-top:9px;">${Icons.plus()}新建一个页面</button>
      </div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.book()}</span>我的页面 <small>${pages.length} 篇</small></div>
        <div id="pgList"></div>
      </div>`;
    $('#vwList').onclick = () => { deepView = 'list'; renderList($('#pageRoot')); };
    $('#vwTl').onclick = () => { deepView = 'timeline'; render($('#pageRoot')); };
    $('#newPage').onclick = async () => {
      const t = await promptBox('新页面标题', '', '比如：第一次做陶艺');
      if (!t) return;
      const arr = getPages();
      const id = uid();
      arr.push({ id, title: t, cover: '', blocks: [{ id: uid(), type: 'text', text: '' }], ts: Date.now(), updated: Date.now() });
      setPages(arr); curId = id; view = 'page'; render($('#pageRoot'));
    };
    const box = $('#pgList');
    if (!pages.length) {
      box.innerHTML = `<div class="empty"><div class="e-ico">${Icons.panda()}</div>还没有页面～<br>点上面新建，开始你的深度探索</div>`;
      return;
    }
    box.innerHTML = pages.map(p => {
      const txt = (p.blocks || []).filter(b => b.type === 'text').map(b => b.text).join(' ').slice(0, 50);
      const cnt = { text: 0, image: 0, table: 0, note: 0 };
      (p.blocks || []).forEach(b => cnt[b.type] = (cnt[b.type] || 0) + 1);
      return `<div class="rec-item" data-id="${p.id}">
        <div class="rec-ico" style="width:44px;height:44px;flex:0 0 44px;">${p.cover ? `<img src="${p.cover}" style="width:100%;height:100%;object-fit:cover;border-radius:11px;">` : '🌍'}</div>
        <div class="rec-main"><div class="t">${esc(p.title)}</div>
        <div class="s">${esc(txt || '（还没写内容）')}</div>
        <div class="hint" style="margin-top:2px;">${new Date(p.updated || p.ts).toLocaleDateString('zh-CN')} · ${cnt.image ? cnt.image + '图 ' : ''}${cnt.table ? cnt.table + '表 ' : ''}${cnt.note ? cnt.note + '便签' : ''}</div></div>
        <span class="chip sm" data-act="del">×</span>
      </div>`;
    }).join('');
    box.onclick = async (e) => {
      const it = e.target.closest('[data-id]'); if (!it) return;
      if (e.target.dataset.act === 'del') {
        if (await confirmBox('删除这个页面？里面的内容都会消失。')) {
          setPages(getPages().filter(x => x.id !== it.dataset.id)); renderList($('#pageRoot')); toast('已删除');
        }
        return;
      }
      curId = it.dataset.id; view = 'page'; render($('#pageRoot'));
    };
  }

  /* ---- 时间轴 ---- */
  function renderTimeline(root) {
    const pages = getPages().slice().sort((a, b) => (b.updated || b.ts) - (a.updated || a.ts));
    const byYear = {};
    pages.forEach((p) => {
      const d = new Date(p.updated || p.ts);
      const y = d.getFullYear(), m = d.getMonth() + 1;
      byYear[y] = byYear[y] || {};
      byYear[y][m] = byYear[y][m] || [];
      byYear[y][m].push(p);
    });
    const years = Object.keys(byYear).sort((a, b) => b - a);
    root.innerHTML = `
      <div class="card" style="background:linear-gradient(135deg,#EAF3F8,#F7F1E4);border-color:#CFE0EA;">
        <div class="card-title"><span class="ci">${Icons.globe()}</span>深度体验时间轴</div>
        <div class="hint" style="line-height:1.7;">按年份回溯你的深度体验，几年前的也能翻到。点任意条目即可打开那一页。</div>
        <button class="btn ghost block sm" id="tlBack" style="margin-top:9px;">📋 返回列表视图</button>
      </div>
      <div id="tl"></div>`;
    $('#tlBack').onclick = () => { deepView = 'list'; renderList($('#pageRoot')); };
    if (!pages.length) {
      $('#tl').innerHTML = `<div class="empty"><div class="e-ico">${Icons.panda()}</div>还没有深度页面～<br>去列表里新建一个吧</div>`;
      return;
    }
    $('#tl').innerHTML = years.map((y) => `
      <div class="card">
        <div class="card-title"><span class="ci">${Icons.star()}</span>${y} 年 <small>${pages.filter(p => new Date(p.updated || p.ts).getFullYear() == y).length} 篇</small></div>
        ${Object.keys(byYear[y]).sort((a, b) => b - a).map((m) => `
          <div style="margin:7px 0 3px;font-weight:800;font-size:12.5px;color:var(--brown2);">${m} 月</div>
          ${byYear[y][m].map((p) => `
            <div class="rec-item" data-id="${p.id}">
              <div class="rec-ico" style="width:38px;height:38px;flex:0 0 38px;">${p.cover ? `<img src="${p.cover}" style="width:100%;height:100%;object-fit:cover;border-radius:11px;">` : '🌍'}</div>
              <div class="rec-main">
                <div class="t">${esc(p.title)}</div>
                <div class="s">${new Date(p.updated || p.ts).toLocaleDateString('zh-CN')}</div>
              </div>
              <span class="chip sm">打开</span>
            </div>`).join('')}
        `).join('')}
      </div>`).join('');
    $('#tl').onclick = (e) => {
      const it = e.target.closest('[data-id]'); if (!it) return;
      curId = it.dataset.id; view = 'page'; render($('#pageRoot'));
    };
  }

  /* ---- 页面详情 ---- */
  function renderPage(root) {
    const pages = getPages();
    const p = pages.find(x => x.id === curId);
    if (!p) { view = 'list'; return renderList(root); }
    root.innerHTML = `
      <div class="card">
        <div class="row" style="margin-bottom:9px;">
          <button class="btn ghost sm" id="back">‹ 返回</button>
          <div class="grow"></div>
          <button class="btn ghost sm" id="setCover">封面</button>
          <button class="btn sm" id="savePage">保存</button>
        </div>
        ${p.cover ? `<img src="${p.cover}" style="width:100%;max-height:170px;object-fit:cover;border-radius:14px;margin-bottom:9px;">` : ''}
        <input class="field" id="pgTitle" value="${esc(p.title)}" style="font-size:16px;font-weight:800;">
        <div class="hint" style="margin-top:5px;">创建于 ${new Date(p.ts).toLocaleDateString('zh-CN')} · 最后编辑 ${new Date(p.updated || p.ts).toLocaleString('zh-CN')}</div>
      </div>

      <div id="blocks"></div>

      <div class="card">
        <div class="card-title"><span class="ci">${Icons.plus()}</span>添加内容块</div>
        <div class="row wrap">
          <button class="btn ghost sm" data-add="text">📝 文字段落</button>
          <button class="btn ghost sm" data-add="image">🖼 图片</button>
          <button class="btn ghost sm" data-add="table">📊 表格</button>
          <button class="btn ghost sm" data-add="note">🗒 彩色便签</button>
        </div>
      </div>`;

    $('#back').onclick = () => { savePage(true); view = 'list'; renderList(root); };
    $('#savePage').onclick = () => { savePage(); toast('已保存 🌍'); };
    $('#setCover').onclick = async () => {
      const im = await pickImage(1000); if (!im) return;
      const arr = getPages(); const q = arr.find(x => x.id === curId);
      q.cover = im; q.updated = Date.now(); setPages(arr); renderPage(root);
    };
    $$('[data-add]').forEach(b => b.onclick = () => addBlock(b.dataset.add, root));
    drawBlocks(root);
  }

  function savePage(silent) {
    const arr = getPages(); const p = arr.find(x => x.id === curId); if (!p) return;
    const t = $('#pgTitle'); if (t) p.title = t.value.trim() || p.title;
    $$('#blocks [data-bid]').forEach(el => {
      const b = p.blocks.find(x => x.id === el.dataset.bid); if (!b) return;
      if (b.type === 'text') { const ta = el.querySelector('textarea'); if (ta) b.text = ta.value; }
      if (b.type === 'note') { const ta = el.querySelector('textarea'); if (ta) b.text = ta.value; }
      if (b.type === 'table') {
        const rows = Array.from(el.querySelectorAll('tr')).map(tr => Array.from(tr.children).map(td => td.textContent.trim()));
        if (rows.length) b.rows = rows;
      }
      if (b.type === 'image') { const cap = el.querySelector('input'); if (cap) b.cap = cap.value; }
    });
    p.updated = Date.now();
    setPages(arr);
    if (!silent) DB.flushNow();
  }

  function addBlock(type, root) {
    savePage(true);
    const arr = getPages(); const p = arr.find(x => x.id === curId);
    const b = { id: uid(), type };
    if (type === 'text') b.text = '';
    if (type === 'note') { b.text = ''; b.color = NOTE_COLORS[Math.floor(Math.random() * NOTE_COLORS.length)]; }
    if (type === 'table') b.rows = [['项目', '说明', '评分'], ['', '', ''], ['', '', '']];
    if (type === 'image') b.src = '';
    p.blocks.push(b); p.updated = Date.now(); setPages(arr);
    if (type === 'image') {
      pickImage(1000).then(im => {
        const a2 = getPages(); const p2 = a2.find(x => x.id === curId);
        const b2 = p2.blocks.find(x => x.id === b.id);
        if (im) { b2.src = im; } else { p2.blocks = p2.blocks.filter(x => x.id !== b.id); }
        setPages(a2); renderPage(root);
      });
    } else renderPage(root);
  }

  function drawBlocks(root) {
    const p = getPages().find(x => x.id === curId);
    const box = $('#blocks');
    box.innerHTML = (p.blocks || []).map((b, i) => {
      const head = `<div class="row" style="margin-bottom:6px;">
        <span class="hint grow">${{ text: '📝 段落', image: '🖼 图片', table: '📊 表格', note: '🗒 便签' }[b.type]} #${i + 1}</span>
        <button class="chip sm" data-act="up">↑</button>
        <button class="chip sm" data-act="down">↓</button>
        <button class="chip sm" data-act="del">×</button>
      </div>`;
      let body = '';
      if (b.type === 'text') body = `<textarea class="field" style="min-height:110px;" placeholder="写下你的观察、感受、思考…">${esc(b.text || '')}</textarea>`;
      if (b.type === 'note') body = `
        <div style="background:${b.color || '#FFF3C4'};border-radius:12px;padding:9px;box-shadow:2px 3px 8px rgba(140,102,71,.16);transform:rotate(-.6deg);">
          <textarea class="field" style="min-height:78px;background:transparent;border:none;padding:2px;" placeholder="随手一记…">${esc(b.text || '')}</textarea>
          <div class="row wrap" style="margin-top:4px;">${NOTE_COLORS.map(c => `<span data-color="${c}" style="width:18px;height:18px;border-radius:50%;background:${c};border:1.5px solid rgba(107,70,48,.3);"></span>`).join('')}</div>
        </div>`;
      if (b.type === 'image') body = `
        <img src="${b.src}" style="width:100%;border-radius:12px;display:block;">
        <input class="field" value="${esc(b.cap || '')}" placeholder="图注（可选）" style="margin-top:7px;font-size:12px;">`;
      if (b.type === 'table') body = `
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;font-size:12.5px;">
            ${(b.rows || []).map((r, ri) => `<tr>${r.map(c => `<td contenteditable="true" style="border:1.5px solid var(--line);padding:6px 7px;min-width:66px;${ri === 0 ? 'background:var(--cream);font-weight:800;' : ''}">${esc(c)}</td>`).join('')}</tr>`).join('')}
          </table>
        </div>
        <div class="row" style="margin-top:7px;">
          <button class="chip sm" data-act="addrow">+ 行</button>
          <button class="chip sm" data-act="addcol">+ 列</button>
          <button class="chip sm" data-act="delrow">− 行</button>
          <button class="chip sm" data-act="delcol">− 列</button>
        </div>`;
      return `<div class="card" data-bid="${b.id}">${head}${body}</div>`;
    }).join('');

    box.onclick = (e) => {
      const card = e.target.closest('[data-bid]'); if (!card) return;
      const act = e.target.dataset.act;
      const color = e.target.dataset.color;
      const arr = getPages(); const pg = arr.find(x => x.id === curId);
      const i = pg.blocks.findIndex(x => x.id === card.dataset.bid);
      if (i < 0) return;
      if (color) { savePage(true); getPages(); const a2 = getPages(); const p2 = a2.find(x => x.id === curId); p2.blocks[i].color = color; setPages(a2); renderPage(root); return; }
      if (!act) return;
      savePage(true);
      const a3 = getPages(); const p3 = a3.find(x => x.id === curId);
      const b = p3.blocks[i];
      if (act === 'up' && i > 0) { [p3.blocks[i - 1], p3.blocks[i]] = [p3.blocks[i], p3.blocks[i - 1]]; }
      else if (act === 'down' && i < p3.blocks.length - 1) { [p3.blocks[i + 1], p3.blocks[i]] = [p3.blocks[i], p3.blocks[i + 1]]; }
      else if (act === 'del') { p3.blocks.splice(i, 1); }
      else if (act === 'addrow') { b.rows.push(new Array(b.rows[0].length).fill('')); }
      else if (act === 'addcol') { b.rows.forEach((r, ri) => r.push(ri === 0 ? '新列' : '')); }
      else if (act === 'delrow') { if (b.rows.length > 1) b.rows.pop(); }
      else if (act === 'delcol') { if (b.rows[0].length > 1) b.rows.forEach(r => r.pop()); }
      p3.updated = Date.now();
      setPages(a3); renderPage(root);
    };

    // 自动保存
    box.addEventListener('input', () => {
      clearTimeout(box._t);
      box._t = setTimeout(() => savePage(true), 800);
    });
  }

  window.Modules = window.Modules || {};
  window.Modules.deep = {
    id: 'deep', name: '深度地球', desc: '熊猫的深度体验档案', icon: 'panda',
    render, onLeave() { if (view === 'page') savePage(true); }
  };
})();

<script>
/* ===== 模块 8：影视文娱 ===== */
(function () {
  const { $, $$, esc, uid, today, niceDate, toast, modal, confirmBox, promptBox, pickImage } = UI;

  const TYPE_EMO = { '动漫': '📺', '综艺': '🎤', '电影': '🎬', '剧集': '🎞', '纪录': '🐾' };
  const emoOf = (t) => TYPE_EMO[t] || '🎬';

  // 默认 TMDB v3 Key（你已申请：联网即显示真实中文海报）；设置里可覆盖
  const DEFAULT_TMDB_KEY = '8ea047f84452f7bdb9cd5e9e7bfcdb67';
  try { if (!DB.get('pref.tmdbKey', '')) DB.set('pref.tmdbKey', DEFAULT_TMDB_KEY); } catch (e) {}

  // ===== 剧集封面系统 =====
  // 联网时：尝试从海报源获取真实封面；离线时：生成仿视频平台风格的精美占位卡
  const POSTER_COLORS = {
    '动漫': { from: '#7B68EE', to: '#FF69B4', accent: '#E8D0FF' },
    '综艺': { from: '#FF6B35', to: '#F7C948', accent: '#FFF0D4' },
    '电影': { from: '#1A1A2E', to: '#16213E', accent: '#0F3460' },
    '剧集': { from: '#2E86AB', to: '#A23B72', accent: '#F18F01' },
    '纪录': { from: '#2D6A4F', to: '#40916C', accent: '#B7E4C7' }
  };
  const defaultColor = { from: '#667eea', to: '#764ba2', accent: '#e0c3fc' };

  function posterColor(type) { return POSTER_COLORS[type] || defaultColor; }

  // 生成仿爱奇艺/腾讯视频风格的 SVG 封面（离线兜底 + 默认展示）
  function genPoster(it) {
    const c = posterColor(it.type);
    const emo = emoOf(it.type);
    // 根据类型选不同装饰图案
    let decor = '';
    if (it.type === '动漫') {
      decor = `<circle cx="280" cy="40" r="60" fill="white" opacity="0.06"/><circle cx="20" cy="380" r="80" fill="white" opacity="0.04"/>`;
    } else if (it.type === '综艺') {
      decor = `<polygon points="260,30 300,90 220,90" fill="white" opacity="0.07"/><polygon points="40,350 90,420 10,420" fill="white" opacity="0.05"/>`;
    } else {
      decor = `<rect x="240" y="20" width="70" height="70" rx="12" fill="white" opacity="0.05" transform="rotate(15 275 55)"/>
               <rect x="-10" y="340" width="80" height="80" rx="12" fill="white" opacity="0.04" transform="rotate(-10 30 380)"/>`;
    }
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420">
      <defs>
        <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="${c.from}"/>
          <stop offset="100%" stop-color="${c.to}"/>
        </linearGradient>
        <linearGradient id="pgo" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
          <stop offset="100%" stop-color="rgba(0,0,0,0.55)"/>
        </linearGradient>
      </defs>
      <rect width="300" height="420" rx="12" fill="url(#pg)"/>
      ${decor}
      <!-- 底部渐变遮罩 -->
      <rect y="280" width="300" height="140" fill="url(#pgo)" rx="12"/>
      <!-- 类型标签 -->
      <rect x="14" y="340" width="46" height="22" rx="6" fill="rgba(255,255,255,0.25)"/>
      <text x="37" y="355" text-anchor="middle" fill="white" font-size="11" font-family="system-ui">${it.type || ''}</text>
      <!-- 热度角标 -->
      ${it.hot ? `<rect x="240" y="14" width="46" height="22" rx="6" fill="rgba(255,215,0,0.85)"/>
        <text x="263" y="29" text-anchor="middle" fill="#333" font-size="11" font-weight="700" font-family="system-ui">${it.hot}</text>` : ''}
      <!-- 标题 -->
      <text x="150" y="378" text-anchor="middle" fill="white" font-size="18" font-weight="700" font-family="system-ui,sans-serif">${(it.title || '').length > 10 ? (it.title || '').slice(0, 10) + '…' : (it.title || '')}</text>
      <!-- 中央大图标 -->
      <text x="150" y="210" text-anchor="middle" font-size="72" opacity="0.3">${emo}</text>
    </svg>`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }

  // ===== 联网真实封面 =====
  // 优先 TMDB（填了免费 Key 后中文剧名也能出真实海报）→ 退化 TVmaze（英文名更全）→ 生成的占位卡
  async function fetchCoverUrl(title) {
    if (!title) return null;
    const key = DB.get('pref.tmdbKey', '') || DEFAULT_TMDB_KEY;
    if (key) {
      try {
        const q = encodeURIComponent(title);
        const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${encodeURIComponent(key)}&language=zh-CN&query=${q}`);
        if (res.ok) {
          const data = await res.json();
          const results = (data && data.results) || [];
          const r = results.find(x => x.media_type === 'tv' || x.media_type === 'movie') || results[0];
          if (r && r.poster_path) return `https://image.tmdb.org/t/p/w300${r.poster_path}`;
        }
      } catch (e) { /* 落到 TVmaze */ }
    }
    try {
      const q = encodeURIComponent(title);
      const res = await fetch(`https://api.tvmaze.com/search/shows?q=${q}`);
      if (res.ok) {
        const arr = await res.json();
        if (Array.isArray(arr) && arr.length) {
          const hit = arr.find(d => d.show && d.show.name === title) || arr[0];
          const img = hit && hit.show && hit.show.image;
          if (img && (img.medium || img.original)) return img.original || img.medium;
        }
      }
    } catch (e) {}
    return null;
  }

  // 异步增强：联网后把生成的占位卡替换为真实海报，并缓存 URL
  async function enhanceCovers(box) {
    if (!navigator.onLine) return;
    const cards = box ? $$('.mcard', box) : $$('.mcard');
    for (const card of cards) {
      const img = card.querySelector('.mimg');
      if (!img || img.dataset.enhanced) continue;
      img.dataset.enhanced = '1';
      const id = card.dataset.id;
      const it = allItems().find(x => x.id === id);
      if (!it || it.img) continue;            // 用户自定义图已优先
      const url = await fetchCoverUrl(it.title || '');
      if (url) {
        try { it.online = url; setRecs(getRecs()); } catch (e) {}
        img.src = url;                         // 直接显示真实海报
      }
    }
  }

  // 初始封面：用户图 > 已缓存的联网图(在线时) > 生成的精美占位
  function coverOf(it) {
    if (it.img) return it.img;
    if (navigator.onLine && it.online) return it.online;
    return genPoster(it);
  }

  const getRecs = () => DB.get('media.recs', null);
  const setRecs = (v) => DB.set('media.recs', v);
  const getReviews = () => DB.get('media.reviews', []);
  const setReviews = (v) => DB.set('media.reviews', v);

  // 分类词条：每个词条下约 10 部作品推荐（示例种子，可自由增删）

      { id: 'a2', title: '碧蓝之海', type: '动漫', tag: '爆笑·社团', hot: 9.0, desc: '潜水社的醉酒爆笑日常。' },

      { id: 'a4', title: '快乐再出发', type: '综艺', tag: '友情·慢综', hot: 9.1, desc: '几个老友的穷游，笑中带泪。' },
      { id: 'a5', title: '一年一度喜剧大赛', type: '综艺', tag: '新喜剧', hot: 8.8, desc: '新喜剧人的脑洞舞台。' },
